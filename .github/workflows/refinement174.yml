name: 1.7.4 refinement verification
on:
  push:
    branches: [release/1.7.4-camera-metadata-privacy]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-37.1" "build-tools;36.0.0"
      - name: Size and existing ordering behaviour
        run: |
          mkdir -p /tmp/size-checks
          java com.sun.tools.javac.Main -d /tmp/size-checks app/src/main/java/uk/co/traynor/privategallery/core/ui/MediaOrder.java scripts/tests/MediaSizeChecks.java scripts/tests/MediaOrderChecks.java
          java -cp /tmp/size-checks MediaSizeChecks
          java -cp /tmp/size-checks MediaOrderChecks
      - name: Verify JPEG copy sanitisation
        run: |
          java com.sun.tools.javac.Main -d /tmp/size-checks app/src/main/java/uk/co/traynor/privategallery/core/media/JpegPrivacy.java scripts/tests/JpegPrivacyChecks.java
          java -cp /tmp/size-checks JpegPrivacyChecks
      - name: Compile app and tests, run JVM and lint
        run: ./gradlew compileDebugUnitTestKotlin compileDebugAndroidTestKotlin testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refinement174-diagnostics
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: warn
