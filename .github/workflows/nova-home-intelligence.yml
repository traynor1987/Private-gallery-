name: Nova Home Intelligence Android 17
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: nova-intelligence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'feature/nova-home-intelligence' || github.head_ref == 'repair/build-98-nova-intelligence'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NOVA_INTELLIGENCE_VISUALS: ${{ github.head_ref == 'repair/build-98-nova-intelligence' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: privacy1751-${{ runner.os }}-
      - name: Install and verify Android 17 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;22.0"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/previous-android-command-tools-intelligence"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p app/build/intelligence
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version | tee app/build/intelligence/command-tools-version.txt
          grep -Fxq '22.0' app/build/intelligence/command-tools-version.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
          python3 scripts/verify_android17_sdk.py "$ANDROID_HOME" app/build/intelligence/android17-sdk.json
      - name: Verify Nova Brain authorization and accounting
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/cloud_teacher
      - name: Build and check the Cloud Teacher image
        run: |
          docker build -t nova-cloud-teacher:pr-check scripts/cloud_teacher
          docker run --rm --network none nova-cloud-teacher:pr-check python server.py --help
      - name: Check protected Hidden and Sanctuary scope
        run: |
          bash scripts/check_hidden_foundation.sh
          bash scripts/check_hidden_browser.sh
          python3 scripts/verify_sanctuary_browser_scope.py
      - name: Compile and test the isolated debug build
        run: |
          bash scripts/prime_gradle95_ci.sh
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest -Pkotlin.incremental=false --no-daemon --console=plain
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify Intelligence and launcher regressions on Android 17
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder -camera-back emulated -camera-front emulated
          script: |
            bash scripts/run_nova_intelligence_android17.sh
            bash scripts/run_guardian_notification_pipeline93.sh
            adb shell wm size 1200x1800
            adb shell wm density 160
            bash scripts/run_guardian_notification_pipeline93.sh GuardianFoldNotificationTest guardian-fold-notification
            if [ "$NOVA_INTELLIGENCE_VISUALS" = true ]; then bash scripts/run_visual_checkpoint.sh GuardianEvidence90RuntimeTest guardian-evidence-90 uk.co.traynor.privategallery.core.guardian; fi
            if [ "$NOVA_INTELLIGENCE_VISUALS" = true ]; then bash scripts/run_visual_checkpoint.sh SanctuaryAccessibilityUiTest intelligence-sanctuary-accessibility uk.co.traynor.privategallery.home2 blockedAppMovesToHomeAndIsNotRestoredAtNaturalExpiry; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-intelligence-android17
          path: |
            app/build/intelligence
            app/build/home2-evidence/guardian-notification-pipeline-93
            app/build/home2-evidence/guardian-fold-notification
            app/build/home2-evidence/launcher-process-70
            app/build/home2-evidence/guardian-evidence-90
            app/build/home2-evidence/intelligence-sanctuary-accessibility
            app/build/test-results/testDebugUnitTest
