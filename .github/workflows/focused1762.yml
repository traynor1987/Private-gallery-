name: Private Gallery 1.7.6.2 focused Android checks
on:
  push:
    branches: [release/1.7.6.2-ui-browser-polish]
    paths: ['.focused1762']
permissions:
  contents: read
concurrency:
  group: focused1762-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: privacy1751-${{ runner.os }}-
      - name: Install Android 17 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
      - name: Install host fixture test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools tcpdump iptables python3-cryptography tor
      - name: Host security and release checks
        run: |
          PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          mkdir -p /tmp/browser-accept1762
          java com.sun.tools.javac.Main -d /tmp/browser-accept1762 app/src/main/java/uk/co/traynor/privategallery/core/browser/v2/BrowserAcceptTypes.java scripts/tests/BrowserAcceptTypesChecks.java
          java -cp /tmp/browser-accept1762 BrowserAcceptTypesChecks
          mkdir -p /tmp/hidden-library1762
          java -m jdk.compiler/com.sun.tools.javac.Main -d /tmp/hidden-library1762 app/src/main/java/uk/co/traynor/privategallery/core/hidden/HiddenSession.java app/src/main/java/uk/co/traynor/privategallery/core/hidden/HiddenRecordStore.java app/src/main/java/uk/co/traynor/privategallery/core/browser/hidden/HiddenBrowserLibrary.java app/src/test/java/uk/co/traynor/privategallery/core/browser/hidden/HiddenBrowserLibraryHostChecks.java
          java -cp /tmp/hidden-library1762 uk.co.traynor.privategallery.core.browser.hidden.HiddenBrowserLibraryHostChecks
          bash scripts/check_browser_external_results1762.sh
          bash scripts/check_hidden_browser.sh
          bash scripts/check_hidden_foundation.sh
          bash scripts/verify_production_vpn_path.sh
          bash scripts/no_secret_scan.sh
      - name: Compile, JVM tests and lint
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Start ephemeral owned-VPN and packet observation fixture
        run: bash scripts/setup_hidden_vpn_fixture1762.sh
      - name: Start independently verified controlled onion fixture
        run: python3 scripts/ci_onion_probe.py
      - name: Enable acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run focused synthetic Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_atd
          arch: x86_64
          avd-name: focused1762
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: bash scripts/run_focused1762.sh
      - name: Remove ephemeral VPN and private fixture configuration
        if: always()
        run: |
          python3 scripts/ci_onion_probe.py --stop
          bash scripts/cleanup_hidden_vpn_fixture1762.sh
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-gallery-1762-focused
          path: |
            app/build/acceptance-diagnostics/onion-fixture
            app/build/acceptance-diagnostics/onion-server-evidence.txt
            app/build/hidden-vpn1762
            app/build/focused1762
            app/build/outputs/connected_android_test_additional_output
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          if-no-files-found: warn
