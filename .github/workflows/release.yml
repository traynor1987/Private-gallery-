name: Release Private Gallery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semantic version tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'traynor1987/Private-gallery-' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore permanent release signer
        env:
          KEYSTORE_BASE64: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/private-gallery-release.jks"
      - name: Test and build signed release
        env:
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          ./gradlew testDebugUnitTest lintDebug assembleRelease \
            -PPRIVATE_GALLERY_STORE_FILE="$RUNNER_TEMP/private-gallery-release.jks" \
            -PPRIVATE_GALLERY_STORE_PASSWORD="$STORE_PASSWORD" \
            -PPRIVATE_GALLERY_KEY_ALIAS="$KEY_ALIAS" \
            -PPRIVATE_GALLERY_KEY_PASSWORD="$KEY_PASSWORD"
      - name: Prepare signed update assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk private-gallery-release.apk
          sha256sum private-gallery-release.apk > private-gallery-release.apk.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags --force
          git rev-parse "$TAG^{commit}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" private-gallery-release.apk private-gallery-release.apk.sha256 --clobber
          else
            gh release create "$TAG" private-gallery-release.apk private-gallery-release.apk.sha256 --title "Private Gallery $TAG" --generate-notes
          fi
