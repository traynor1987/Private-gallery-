name: 1.7.5 focused media verification
on:
  push:
    branches: [release/1.7.5-media-experience-privacy]
    paths: ['app/**', 'scripts/**', '.github/workflows/refinement175.yml']
concurrency:
  group: refinement175-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  compile:
    if: "!contains(github.event.head_commit.message, '[release-candidate]')"
    runs-on: ubuntu-24.04
    steps:
      - name: Retire only the superseded unsigned candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,os,urllib.request
          base='https://api.github.com/repos/traynor1987/Private-gallery-/actions/runs/40099936654'
          def call(url,method='GET'):
              request=urllib.request.Request(url,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  body=response.read()
                  return json.loads(body) if body else None
          run=call(base)
          if run['head_sha']=='a2a6c0506f7660b0efd7ae0e5072b366e879a3a0' and run['head_branch']=='release/1.7.5-media-experience-privacy' and run['status'] in ('queued','in_progress'):
              jobs=call(base+'/jobs')['jobs']
              signing=[step for job in jobs for step in job['steps'] if step['name']=='Verify original permanent signing identity is available']
              if signing and all(step['status']=='pending' for step in signing):
                  call(base+'/cancel','POST')
                  print('Cancelled superseded candidate before signing; replacement keeps every release gate.')
              else: print('Signing already started; preserved existing candidate run.')
          else: print('Superseded candidate already complete; no cancellation.')
          PYCODE
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - name: Install SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
      - name: Viewer gesture and seeking policy
        run: |
          mkdir -p /tmp/viewer175
          java com.sun.tools.javac.Main -d /tmp/viewer175 app/src/main/java/uk/co/traynor/privategallery/core/ui/ViewerExperience.java scripts/tests/ViewerExperienceChecks.java
          java -cp /tmp/viewer175 ViewerExperienceChecks
      - name: Size and existing ordering behaviour
        run: |
          mkdir -p /tmp/size-checks
          java com.sun.tools.javac.Main -d /tmp/size-checks app/src/main/java/uk/co/traynor/privategallery/core/ui/MediaOrder.java scripts/tests/MediaSizeChecks.java scripts/tests/MediaOrderChecks.java
          java -cp /tmp/size-checks MediaSizeChecks
          java -cp /tmp/size-checks MediaOrderChecks
      - name: Verify JPEG copy sanitisation
        run: |
          java com.sun.tools.javac.Main -d /tmp/size-checks app/src/main/java/uk/co/traynor/privategallery/core/media/JpegPrivacy.java app/src/main/java/uk/co/traynor/privategallery/core/media/PngPrivacy.java scripts/tests/PngPrivacyChecks.java scripts/tests/JpegPrivacyChecks.java app/src/main/java/uk/co/traynor/privategallery/core/media/DisplayDateTime.java scripts/tests/DisplayDateChecks.java
          java -cp /tmp/size-checks JpegPrivacyChecks
          java -cp /tmp/size-checks PngPrivacyChecks
          java -cp /tmp/size-checks DisplayDateChecks
      - name: Compile app and tests, run JVM and lint
        run: ./gradlew compileDebugUnitTestKotlin compileDebugAndroidTestKotlin testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Focused privacy, viewer and playback checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_atd
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-linux-hw-accel: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=uk.co.traynor.privategallery.ui.MediaExperience175Test,uk.co.traynor.privategallery.PrivacyShield175Test,uk.co.traynor.privategallery.core.media.PrivateVideoPlayerTest,uk.co.traynor.privategallery.ui.MediaChromeTest,uk.co.traynor.privategallery.SmartUnlockLifecycle173Test --stacktrace
            python3 scripts/verify_professional_ui_results.py app/build/outputs/androidTest-results/connected/debug uk.co.traynor.privategallery.ui.MediaExperience175Test,uk.co.traynor.privategallery.PrivacyShield175Test,uk.co.traynor.privategallery.core.media.PrivateVideoPlayerTest,uk.co.traynor.privategallery.ui.MediaChromeTest,uk.co.traynor.privategallery.SmartUnlockLifecycle173Test
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refinement175-diagnostics
          path: |
            app/build/reports
            app/build/test-results
            app/build/outputs/androidTest-results
            app/build/outputs/connected_android_test_additional_output
          if-no-files-found: warn
