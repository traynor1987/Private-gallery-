name: Android
on:
  push:
    branches: [main, feat/private-gallery-v1, feature/vpn-vault-favourite, feature/browser-v2]
  pull_request:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Enforce public-source no-secret boundary
        run: ./scripts/no_secret_scan.sh
      - name: Verify WireGuard-only production dependency path and notices
        run: bash ./scripts/verify_production_vpn_path.sh
      # Compile the app and instrumentation APKs before running UI tests on an emulator.
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Run Android UI and Browser V2 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p app/build/acceptance-diagnostics
            set +e
            ./gradlew connectedDebugAndroidTest --stacktrace --info
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              adb logcat -d -v threadtime -t 12000 > app/build/acceptance-diagnostics/emulator-logcat.txt
              adb shell dumpsys activity processes > app/build/acceptance-diagnostics/activity-processes.txt 2>&1 || true
              adb shell dumpsys package uk.co.traynor.privategallery > app/build/acceptance-diagnostics/app-package.txt 2>&1 || true
              echo "===== Instrumentation crash summary ====="
              rg -n -C 5 'FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION_(RESULT|CODE)|Instrumentation run failed|Process .* died|am_crash|Process crashed|Unable to start instrumentation' app/build/acceptance-diagnostics/emulator-logcat.txt | tail -n 500 || true
            fi
            exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-gallery-debug-and-instrumentation-diagnostics
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
            app/build/acceptance-diagnostics
          if-no-files-found: warn
