name: Android
on:
  push:
    branches: [main, feat/private-gallery-v1, feature/vpn-vault-favourite, feature/browser-v2]
  pull_request:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Enforce public-source no-secret boundary
        run: ./scripts/no_secret_scan.sh
      - name: Verify WireGuard-only production dependency path and notices
        run: bash ./scripts/verify_production_vpn_path.sh
      # Compile the app and instrumentation APKs before running UI tests on an emulator.
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Run Android UI and Browser V2 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The app targets API 36, so instrumentation must run on API 36 or newer.
          api-level: 36
          # Google ATD is the headless Google image for instrumentation CI.
          # It retains the Google WebView provider required by Browser V2 tests.
          target: google_atd
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          # Google ATD exposes no stable Settings service at the action's animation-write point.
          # The test app does not rely on system animation scale.
          disable-animations: false
          script: bash ./scripts/run_android_instrumentation_with_diagnostics.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-gallery-debug-and-instrumentation-diagnostics
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
            app/build/acceptance-diagnostics
          if-no-files-found: warn
