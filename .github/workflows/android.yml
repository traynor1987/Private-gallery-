name: Android
on:
  push:
    branches: [release/1.7-encrypted-camera, release/1.5-hidden-vault, main, feat/private-gallery-v1, feature/vpn-vault-favourite, feature/browser-v2, feature/image-editor, feature/ai-provider-setup]
  pull_request:
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
      - name: Verify retired model weights are absent
        run: python3 scripts/verify_local_ai_distribution.py
      - name: Verify encrypted camera journal
        run: bash scripts/check_camera.sh
      - name: Verify bounded Hidden storage
        run: bash scripts/check_hidden_foundation.sh
      - name: Verify Hidden browser and diagnostics policy
        run: bash scripts/check_hidden_browser.sh
      - name: Test browser video helper
        run: node --test scripts/tests/*.test.cjs
      - name: Verify complete MP4 container boundaries
        run: bash scripts/check_video_container.sh
      - name: Enforce public-source no-secret boundary
        run: ./scripts/no_secret_scan.sh
      - name: Verify supported transport dependency path and notices
        run: bash ./scripts/verify_production_vpn_path.sh
      # Compile the app and instrumentation APKs before running UI tests on an emulator.
      - run: ./gradlew compileDebugUnitTestKotlin compileDebugAndroidTestKotlin
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify retired native runtime is absent from APK
        run: python3 scripts/verify_local_ai_distribution.py app/build/outputs/apk/debug/app-debug.apk
      - name: Inventory Hidden Tor native distribution
        run: python3 scripts/verify_hidden_tor_distribution.py app/build/outputs/apk/debug/app-debug.apk app/build/acceptance-diagnostics/tor-distribution.json
      - name: Verify TEST ONLY identity and APK signature
        if: github.ref == 'refs/heads/release/1.7-encrypted-camera'
        run: |
          mkdir -p app/build/acceptance-diagnostics
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > app/build/acceptance-diagnostics/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > app/build/acceptance-diagnostics/apk-badging.txt
          grep -q "package: name='uk.co.traynor.privategallery.hiddenprototype'" app/build/acceptance-diagnostics/apk-badging.txt
          grep -q 'TEST-ONLY' app/build/acceptance-diagnostics/apk-badging.txt
          sha256sum "$APK" > app/build/acceptance-diagnostics/apk-sha256.txt
      - name: Enable and verify emulator hardware acceleration
        run: |
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Publish disposable real onion test endpoint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tor
          python3 scripts/ci_onion_probe.py
      - name: Run Android UI and Browser V2 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The app targets API 36, so instrumentation must run on API 36 or newer.
          api-level: 36
          disable-linux-hw-accel: false
          # Google ATD is the headless Google image for instrumentation CI.
          # It retains the Google WebView provider required by Browser V2 tests.
          target: google_atd
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          # Google ATD exposes no stable Settings service at the action's animation-write point.
          # The test app does not rely on system animation scale.
          disable-animations: false
          script: |
            bash ./scripts/run_hidden_browser_preflight.sh
            bash ./scripts/run_android_instrumentation_with_diagnostics.sh
            if [ "$GITHUB_REF" = "refs/heads/release/1.7-encrypted-camera" ]; then bash ./scripts/verify_synthetic_upgrade.sh; fi
      - name: Verify original permanent signing identity is available
        id: signer_probe
        if: github.repository == 'traynor1987/Private-gallery-' && github.ref == 'refs/heads/release/1.7-encrypted-camera' && github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: bash scripts/verify_permanent_signer.sh
      - name: Build and verify production candidate after mandatory tests
        id: production_build
        if: github.repository == 'traynor1987/Private-gallery-' && github.ref == 'refs/heads/release/1.7-encrypted-camera' && github.event_name == 'push' && steps.signer_probe.outcome == 'success'
        env:
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_FILE: ${{ runner.temp }}/private-gallery-release.jks
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: |
          test -s app/build/acceptance-diagnostics/upgrade-result.txt
          ./gradlew lintRelease assembleRelease
          bash scripts/verify_production_candidate.sh
          python3 scripts/verify_hidden_tor_distribution.py app/build/outputs/apk/release/app-release.apk app/build/production-evidence/tor-distribution.json
      - name: Verify synthetic production-package signed upgrade
        if: github.repository == 'traynor1987/Private-gallery-' && github.ref == 'refs/heads/release/1.7-encrypted-camera' && github.event_name == 'push' && steps.signer_probe.outcome == 'success' && steps.production_build.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PRODUCTION_UPGRADE: "1"
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_FILE: ${{ runner.temp }}/private-gallery-release.jks
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        with:
          api-level: 36
          target: google_atd
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash scripts/verify_synthetic_upgrade.sh
      - name: Upload verified production candidate for owner acceptance
        if: success() && github.repository == 'traynor1987/Private-gallery-' && github.ref == 'refs/heads/release/1.7-encrypted-camera' && github.event_name == 'push' && steps.signer_probe.outcome == 'success' && steps.production_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: private-gallery-1.7-camera-candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/production-evidence
          retention-days: 30
      - name: Remove disposable onion endpoint
        if: always()
        run: python3 scripts/ci_onion_probe.py --stop
      - name: Remove restored signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/private-gallery-release.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-gallery-debug-and-instrumentation-diagnostics
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
            app/build/acceptance-diagnostics
            app/build/production-evidence
            app/build/outputs/connected_android_test_additional_output
          if-no-files-found: warn
