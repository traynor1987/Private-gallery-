name: Android
on:
  push:
    branches: [main, feat/private-gallery-v1, feature/vpn-vault-favourite, feature/browser-v2, feature/image-editor, feature/ai-provider-setup]
  pull_request:
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Install host Vulkan shader compiler
        run: bash scripts/install_vulkan_build_tools.sh
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "emulator" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Test inherited model descriptor reader
        run: |
          g++ -std=c++17 -pthread scripts/native/model_fd_test.cpp -o "$RUNNER_TEMP/model-fd-test"
          "$RUNNER_TEMP/model-fd-test"
      - name: Test native compute network restriction
        run: |
          g++ -std=c++17 -pthread scripts/native/network_guard_test.cpp -o "$RUNNER_TEMP/network-guard-test"
          "$RUNNER_TEMP/network-guard-test"
      - name: Verify models remain optional downloads
        run: python3 scripts/verify_local_ai_distribution.py
      - name: Test browser video helper
        run: node --test scripts/tests/*.test.cjs
      - name: Enforce public-source no-secret boundary
        run: ./scripts/no_secret_scan.sh
      - name: Verify WireGuard-only production dependency path and notices
        run: bash ./scripts/verify_production_vpn_path.sh
      # Compile the app and instrumentation APKs before running UI tests on an emulator.
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Record base APK size and verify no model weights are packaged
        run: python3 scripts/verify_local_ai_distribution.py app/build/outputs/apk/debug/app-debug.apk
      - name: Enable and verify emulator hardware acceleration
        run: |
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Run Android UI and Browser V2 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The app targets API 36, so instrumentation must run on API 36 or newer.
          api-level: 36
          disable-linux-hw-accel: false
          # Google ATD is the headless Google image for instrumentation CI.
          # It retains the Google WebView provider required by Browser V2 tests.
          target: google_atd
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          # Google ATD exposes no stable Settings service at the action's animation-write point.
          # The test app does not rely on system animation scale.
          disable-animations: false
          script: bash ./scripts/run_android_instrumentation_with_diagnostics.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-gallery-debug-and-instrumentation-diagnostics
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
            app/build/acceptance-diagnostics
            app/build/outputs/connected_android_test_additional_output
          if-no-files-found: warn
