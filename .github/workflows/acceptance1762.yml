name: Private Gallery 1.7.6.2 original-key owner acceptance
on:
  push:
    branches: [release/1.7.6.2-ui-browser-polish]
    paths: ['.acceptance1762-candidate']
permissions:
  contents: read
  actions: read
concurrency:
  group: production1762
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'traynor1987/Private-gallery-' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FROZEN_SOURCE: '97e94452ceb9c5262521d7552f0c25eeb07374eb'
    steps:
      - uses: actions/checkout@v4
      - name: Preserve release-control scope and independent review before frozen checkout
        run: |
          test -s docs/release1762/FINAL_SCOPE_APPROVAL.json
          test -s docs/release1762/FINAL_SECURITY_REVIEW.md
          cp docs/release1762/FINAL_SCOPE_APPROVAL.json "$RUNNER_TEMP/final-scope1762.json"
          cp docs/release1762/FINAL_SECURITY_REVIEW.md "$RUNNER_TEMP/final-security1762.md"
          cp scripts/verify_hidden_vpn_fixture1762.py "$RUNNER_TEMP/reviewed-vpn-verifier.py"
          cp scripts/verify_final_scope1762.py "$RUNNER_TEMP/reviewed-scope-verifier.py"
          git rev-parse HEAD > "$RUNNER_TEMP/release-control1762-sha.txt"
      - uses: actions/checkout@v4
        with:
          ref: '97e94452ceb9c5262521d7552f0c25eeb07374eb'
          fetch-depth: 0
      - name: Require exact completed source and immutable reviewed evidence
        uses: actions/github-script@v7
        with:
          script: |
            const source = process.env.FROZEN_SOURCE;
            if (source !== '97e94452ceb9c5262521d7552f0c25eeb07374eb' || context.ref !== 'refs/heads/release/1.7.6.2-ui-browser-polish' || context.eventName !== 'push') throw new Error('Untrusted release source/event');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id:40848723808});
            if (run.head_sha !== source || run.status !== 'completed' || run.conclusion !== 'failure' || run.path !== '.github/workflows/focused1762.yml' || run.event !== 'push') throw new Error('Unexpected original evidence run');
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({...context.repo, run_id:run.id});
            const job = jobs.jobs.find(j => j.id === 123362562064);
            const required = ['Host security and release checks','Compile, JVM tests and lint','Start ephemeral owned-VPN and packet observation fixture','Start independently verified controlled onion fixture','Preserve test evidence'];
            if (!job || required.some(name => !job.steps.some(s => s.name === name && s.conclusion === 'success'))) throw new Error('Build/fixture/evidence prerequisites missing');
            const failed = job.steps.filter(s => s.conclusion === 'failure');
            if (failed.length !== 1 || failed[0].name !== 'Run focused synthetic Android tests') throw new Error('Unexpected failed stage');
            const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:run.id});
            const artifact = artifacts.artifacts.find(a => a.id === 12887270723 && a.name === 'private-gallery-1762-focused' && !a.expired);
            const expectedDigest = 'sha256:b01b11d5ba2bbfeadfa097957b1ca5b7ab2313c502c1a622617a1abf7457a2fc';
            if (!artifact || artifact.digest !== expectedDigest) throw new Error('Immutable evidence mismatch');
            const download = await github.rest.actions.downloadArtifact({...context.repo,artifact_id:artifact.id,archive_format:'zip'});
            const fs = require('fs'), crypto = require('crypto'), bytes = Buffer.from(download.data);
            if ('sha256:' + crypto.createHash('sha256').update(bytes).digest('hex') !== expectedDigest) throw new Error('Evidence checksum mismatch');
            fs.writeFileSync(process.env.RUNNER_TEMP + '/focused1762.zip',bytes);
            fs.mkdirSync('app/build/production-evidence',{recursive:true});
            fs.writeFileSync('app/build/production-evidence/focused-run.json',JSON.stringify({source_sha:source,run_id:run.id,artifact_id:artifact.id,artifact_digest:artifact.digest,conclusion:run.conclusion,verified_build_steps:true,original_exit_status:1,evidence_validation:'PENDING'},null,2));
      - name: Validate every focused security result before exposing signer
        run: |
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          # Restored owner scope: the old code43 source must never reach signer access.
          grep -Fq 'versionCode = 45' app/build.gradle.kts
          cp "$RUNNER_TEMP/final-scope1762.json" app/build/production-evidence/
          cp "$RUNNER_TEMP/final-security1762.md" app/build/production-evidence/
          cp "$RUNNER_TEMP/release-control1762-sha.txt" app/build/production-evidence/
          mkdir -p app/build/production-evidence/focused
          unzip -q "$RUNNER_TEMP/focused1762.zip" -d app/build/production-evidence/focused
          test "$(cat app/build/production-evidence/focused/focused1762/source-sha.txt)" = "$FROZEN_SOURCE"
          test "$(cat app/build/production-evidence/focused/focused1762/exit-status.txt)" = 1
          python3 scripts/verify_focused1762.py app/build/production-evidence/focused/outputs/androidTest-results/connected/debug
          python3 - <<'PYCODE'
          import re,pathlib,xml.etree.ElementTree as ET
          selectors=re.search("classes='([^']+)'",pathlib.Path('scripts/run_focused1762.sh').read_text()).group(1).split(',')
          expected=set()
          for selector in selectors:
              name,separator,method=selector.partition('#')
              if separator: expected.add((name,method));continue
              source=pathlib.Path('app/src/androidTest/java').joinpath(*name.split('.')).with_suffix('.kt')
              methods=re.findall(r'@Test(?:\([^)]*\))?\s+fun\s+(\w+)',source.read_text())
              assert methods, name
              expected.update((name,method) for method in methods)
          reports=pathlib.Path('app/build/production-evidence/focused/outputs/androidTest-results/connected/debug')
          cases=[case for report in reports.rglob('*.xml') for case in ET.parse(report).getroot().iter('testcase')]
          actual={(case.get('classname'),case.get('name')) for case in cases}
          assert actual==expected and len(cases)==len(expected), (expected-actual,actual-expected)
          print(f'PASS: all {len(expected)} exact selected methods present once')
          PYCODE
          # Preserve original failed status. Re-evaluate its immutable actual packet/body
          # evidence with the reviewed strict ADB question-order correction before keys.
          evidence=app/build/production-evidence/focused
          cp "$evidence/focused1762/native-tor1762-result.json" "$evidence/hidden-vpn1762/native-tor1762-result.json"
          python3 "$RUNNER_TEMP/reviewed-vpn-verifier.py" "$evidence/hidden-vpn1762" > app/build/production-evidence/revalidated-vpn.txt
          python3 scripts/verify_native_tor1762.py "$evidence/hidden-vpn1762" "$evidence/acceptance-diagnostics/onion-fixture" > app/build/production-evidence/revalidated-tor.txt
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib
          validator=pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed-vpn-verifier.py'
          digest=hashlib.sha256(validator.read_bytes()).hexdigest()
          assert digest=='a9359061347d0dd79bf527fe724dcbceb4e7f998332e19570c922f33eb33e3c0'
          p=pathlib.Path('app/build/production-evidence/focused-run.json');proof=json.loads(p.read_text())
          assert proof['conclusion']=='failure' and proof['original_exit_status']==1
          proof.update(evidence_validation='PASS',validated_case_count=13,reviewed_validator_sha256=digest)
          p.write_text(json.dumps(proof,indent=2)+'\n')
          PYCODE
          python3 "$RUNNER_TEMP/reviewed-scope-verifier.py" "$RUNNER_TEMP/final-scope1762.json" "$FROZEN_SOURCE" "$RUNNER_TEMP/final-security1762.md" app/build/production-evidence/focused-run.json
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: privacy1751-${{ runner.os }}-
      - name: Install and verify Android 17 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
          python3 scripts/verify_android17_sdk.py "$ANDROID_HOME" app/build/production-evidence/android17-sdk.json
      - name: Verify original production private key and certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: |
          bash scripts/verify_permanent_signer.sh
          cp app/build/acceptance-diagnostics/permanent-signer.txt app/build/production-evidence/
      - name: Build exact frozen production source and verify identity
        env:
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_FILE: ${{ runner.temp }}/private-gallery-release.jks
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: |
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          ./gradlew lintRelease assembleRelease --stacktrace
          bash scripts/verify_production_candidate.sh
          python3 scripts/verify_local_ai_distribution.py app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify_hidden_tor_distribution.py app/build/outputs/apk/release/app-release.apk app/build/production-evidence/tor-distribution.json
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Original-key code44 to code45 in-place upgrade and restart
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PRIVATE_GALLERY_UPGRADE_BASELINE: '44'
          PRODUCTION_UPGRADE: '1'
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_FILE: ${{ runner.temp }}/private-gallery-release.jks
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        with:
          api-level: '37.0'
          target: google_atd
          arch: x86_64
          avd-name: upgrade1762-from44
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: |
            bash scripts/verify_android17_device.sh app/build/production-evidence/from44
            test "$(adb shell getenforce | tr -d '\r')" = Enforcing
            bash scripts/verify_synthetic_upgrade.sh
            cp app/build/production-evidence/upgrade-* app/build/production-evidence/from44/
      - name: Require original-key code44 upgrade proof for the one APK
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('app/build/production-evidence')
          apk=pathlib.Path('app/build/outputs/apk/release/app-release.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          source=os.environ['FROZEN_SOURCE']
          cert='94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17'
          package=(root/'package.txt').read_text()
          assert "package: name='uk.co.traynor.privategallery' versionCode='45' versionName='1.7.6.2'" in package
          assert "sdkVersion:'37'" in package and "targetSdkVersion:'37'" in package
          assert 'application-debuggable' not in package
          assert cert in (root/'signature.txt').read_text()
          assert (root/'source-sha.txt').read_text().strip()==source
          assert (root/'apk-sha256.txt').read_text().split()[0]==digest
          expected={44:'1ac9ebf7f5c6e4665ca3416e0e37b78bc52131e9'}
          for code,baseline in expected.items():
              d=root/f'from{code}'
              assert (d/'upgrade-baseline-source-sha.txt').read_text().strip()==baseline
              assert (d/'upgrade-candidate-source-sha.txt').read_text().strip()==source
              assert (d/'upgrade-candidate-sha256.txt').read_text().split()[0]==digest
              for phase in ('baseline','candidate'):
                  assert cert in (d/f'upgrade-{phase}-signature.txt').read_text()
              for phase in ('seed','verify','after-restart'):
                  assert 'OK (1 test)' in (d/f'upgrade-{phase}.txt').read_text()
              assert (d/'upgrade-result.txt').read_text().startswith('PASS:')
          (root/'release-summary.json').write_text(json.dumps(dict(source_sha=source,version='1.7.6.2',version_code=45,package='uk.co.traynor.privategallery',apk_sha256=digest,original_certificate_sha256=cert,synthetic_original_key_upgrades=[44],historical_upgrades_to_code44=[41,42,43],restart='PASS',owner_physical_acceptance='NOT_PERFORMED',hidden_interactive_vpn='VERIFIED'),indent=2)+'\n')
          print('PASS: exact original-certificate candidate and code44 in-place upgrade/restart path')
          PY
      - name: Deliver one verified owner-acceptance APK
        uses: actions/upload-artifact@v4
        with:
          name: private-gallery-1.7.6.2-code45-owner-acceptance
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/production-evidence
          retention-days: 30
      - name: Remove original signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/private-gallery-release.jks"
      - name: Preserve release failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-gallery-1762-production-failure-evidence
          path: |
            app/build/production-evidence
            app/build/reports/lint-results-release.html
          if-no-files-found: warn
