            fs.writeFileSync(process.env.RUNNER_TEMP+'/release1710/runtime.zip',Buffer.from(zip.data));
            fs.writeFileSync(process.env.RUNNER_TEMP+'/release1710/SECURITY_REVIEW.md',review);
            fs.writeFileSync(process.env.RUNNER_TEMP+'/release1710/marker.json',JSON.stringify(marker));
            const fixture=fs.readFileSync('docs/release1710/UpgradeFixtureTest.kt');
            if(!/^[a-f0-9]{64}$/.test(marker.fixture_sha256)||crypto.createHash('sha256').update(fixture).digest('hex')!==marker.fixture_sha256||!review.toString().includes('Upgrade fixture SHA-256: '+marker.fixture_sha256))throw Error('Unreviewed upgrade fixture');
            const fixturePath=process.env.RUNNER_TEMP+'/release1710/UpgradeFixtureTest.kt';
            fs.writeFileSync(fixturePath,fixture);
            core.exportVariable('PRIVATE_GALLERY_1710_UPGRADE_FIXTURE',fixturePath);
            core.exportVariable('PRIVATE_GALLERY_1710_UPGRADE_FIXTURE_SHA256',marker.fixture_sha256);
            core.exportVariable('FROZEN_SOURCE',marker.source);
      - name: Validate original runtime XML and checkout immutable application source
        run: |
          python3 scripts/verify_home1710_runtime.py "$RUNNER_TEMP/release1710/runtime.zip"
