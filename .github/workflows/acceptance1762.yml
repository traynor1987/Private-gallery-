            cp app/build/production-evidence/upgrade-* app/build/production-evidence/from48/
      - name: Require original-key code48 upgrade proof for the one APK
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('app/build/production-evidence')
          apk=pathlib.Path('app/build/outputs/apk/release/app-release.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          source=os.environ['FROZEN_SOURCE']
          cert='94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17'
          package=(root/'package.txt').read_text()
          assert "package: name='uk.co.traynor.privategallery' versionCode='49' versionName='1.7.8'" in package
          assert "sdkVersion:'37'" in package and "targetSdkVersion:'37'" in package
          assert 'application-debuggable' not in package
          assert cert in (root/'signature.txt').read_text()
          assert (root/'source-sha.txt').read_text().strip()==source
          assert (root/'apk-sha256.txt').read_text().split()[0]==digest
          expected={48:'41b6d065a3fbef2f711198c9c778f7100e620c8f'}
          for code,baseline in expected.items():
              d=root/f'from{code}'
              assert (d/'upgrade-baseline-source-sha.txt').read_text().strip()==baseline
              assert (d/'upgrade-baseline-sha256.txt').read_text().split()[0]=='c9f43de796f0af15b95df54aabba686a11b4b6b6bb4eb08cf00169cccf7b7ec5'
              assert (d/'upgrade-candidate-source-sha.txt').read_text().strip()==source
              assert (d/'upgrade-candidate-sha256.txt').read_text().split()[0]==digest
              for phase in ('baseline','candidate'):
                  assert cert in (d/f'upgrade-{phase}-signature.txt').read_text()
              for phase in ('seed','verify','after-restart'):
                  assert 'OK (1 test)' in (d/f'upgrade-{phase}.txt').read_text()
              assert (d/'upgrade-result.txt').read_text().startswith('PASS:')
          (root/'release-summary.json').write_text(json.dumps(dict(source_sha=source,version='1.7.8',version_code=49,package='uk.co.traynor.privategallery',apk_sha256=digest,original_certificate_sha256=cert,synthetic_original_key_upgrades=[48],baseline_artifact='exact_archived_original_signed_1.7.8_code48_from_run41156213785_artifact13025351799',restart='PASS',owner_physical_acceptance='NOT_PERFORMED',hidden_interactive_vpn='VERIFIED'),indent=2)+'\n')
          print('PASS: exact original-certificate candidate and code48 in-place upgrade/restart path')
          PY
      - name: Deliver one verified owner-acceptance APK
        uses: actions/upload-artifact@v4
        with:
          name: private-gallery-1.7.8-code49-owner-acceptance
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/production-evidence
          retention-days: 30
      - name: Remove original signing material
