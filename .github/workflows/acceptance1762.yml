          script: bash "$RUNNER_TEMP/release179-controls/scripts/verify_synthetic_upgrade179.sh"
      - name: Validate actual original-key upgrade and one deliverable APK
        run: |
          control="$RUNNER_TEMP/release179-controls"
          python3 "$control/scripts/validate_upgrade179.py" --evidence app/build/production-evidence/from50 --candidate app/build/outputs/apk/release/app-release.apk --source "$FROZEN_SOURCE" --fixture "$PRIVATE_GALLERY_179_UPGRADE_FIXTURE" --output app/build/production-evidence/upgrade-validation.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('app/build/production-evidence');apk=pathlib.Path('app/build/outputs/apk/release/app-release.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest();upgrade=json.loads((root/'upgrade-validation.json').read_text())
          assert upgrade['decision']=='PASS' and upgrade['candidate_apk_sha256']==digest and upgrade['source_sha']==os.environ['FROZEN_SOURCE']
          assert (root/'source-sha.txt').read_text().strip()==os.environ['FROZEN_SOURCE']
          assert (root/'apk-sha256.txt').read_text().split()[0]==digest
          assert list(apk.parent.glob('*.apk'))==[apk]
          (root/'release-summary.json').write_text(json.dumps(dict(source_sha=os.environ['FROZEN_SOURCE'],version='1.7.9',version_code=51,package='uk.co.traynor.privategallery',apk_sha256=digest,original_certificate_sha256=upgrade['certificate_sha256'],synthetic_original_key_upgrades=[50],restart='PASS',owner_physical_acceptance='OWNER_REQUIRED',focused_original_artifact=json.loads((root/'focused-run.json').read_text())['artifact_digest']),indent=2)+'\n')
          PY
      - name: Curate public release receipts
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/release179-controls/scripts/curate_release179.py"; then
            python3 "$RUNNER_TEMP/release179-controls/scripts/curate_release179.py" app/build/production-evidence "$RUNNER_TEMP/release179-delivery/production-evidence"
          fi
      - name: Stage the one verified APK beside filtered evidence
        run: |
          test -s app/build/production-evidence/upgrade-validation.json
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release179-delivery/app-release.apk"
          cmp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release179-delivery/app-release.apk"
          test "$(find "$RUNNER_TEMP/release179-delivery" -type f -name '*.apk' | wc -l)" -eq 1
      - name: Deliver one verified original-key owner acceptance APK
        uses: actions/upload-artifact@v4
        with:
          name: private-gallery-1.7.9-code51-owner-acceptance
          path: ${{ runner.temp }}/release179-delivery
          if-no-files-found: error
          retention-days: 30
      - name: Remove original signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/private-gallery-release.jks"
      - name: Preserve filtered release failure receipts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-gallery-179-production-failure-evidence
          path: ${{ runner.temp }}/release179-delivery/production-evidence
          if-no-files-found: warn

  acceptance1710:
    if: github.repository == 'traynor1987/Private-gallery-' && github.event_name == 'push' && github.ref == 'refs/heads/release/1.7.10-private-home'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require exact-source runtime success and independent security approval before signer access
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const marker=JSON.parse(fs.readFileSync('.acceptance1710-candidate','utf8'));
            if(!/^[a-f0-9]{40}$/.test(marker.source)||!Number.isSafeInteger(marker.test_run))throw Error('Unfrozen release');
            const review=fs.readFileSync('docs/release1710/SECURITY_REVIEW.md');
            if(crypto.createHash('sha256').update(review).digest('hex')!==marker.review_sha256||!review.toString().includes('Source: '+marker.source)||!review.toString().includes('Decision: APPROVED'))throw Error('Missing exact-source review');
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:marker.test_run})).data;
            if(run.event!=='push'||run.head_repository.full_name!=='traynor1987/Private-gallery-'||run.status!=='completed'||run.conclusion!=='success'||run.head_sha!==marker.source||run.head_branch!=='release/1.7.10-private-home'||!run.path.endsWith('/fast-development.yml'))throw Error('Missing exact-source runtime success');
            const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:marker.test_run})).data.jobs;
            const job=jobs.find(j=>j.name==='private-home1710');
            if(!job||job.conclusion!=='success'||!job.steps.some(s=>s.name==='Grouped Home and changed privacy-boundary Android 17 verification'&&s.conclusion==='success'))throw Error('Runtime job did not execute');
            const artifacts=(await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:marker.test_run})).data.artifacts;
            const matches=artifacts.filter(a=>a.name==='private-home1710-verification'&&!a.expired);if(matches.length!==1)throw Error('Ambiguous runtime artifact');
            const zip=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:matches[0].id,archive_format:'zip'});
            fs.mkdirSync(process.env.RUNNER_TEMP+'/release1710',{recursive:true});
            fs.writeFileSync(process.env.RUNNER_TEMP+'/release1710/runtime.zip',Buffer.from(zip.data));
            fs.writeFileSync(process.env.RUNNER_TEMP+'/release1710/SECURITY_REVIEW.md',review);
            fs.writeFileSync(process.env.RUNNER_TEMP+'/release1710/marker.json',JSON.stringify(marker));
            core.exportVariable('FROZEN_SOURCE',marker.source);
      - name: Validate original runtime XML and checkout immutable application source
        run: |
          python3 scripts/verify_home1710_runtime.py "$RUNNER_TEMP/release1710/runtime.zip"
          git checkout --detach "$FROZEN_SOURCE"
          mkdir -p app/build/production-evidence
          cp "$RUNNER_TEMP/release1710/marker.json" "$RUNNER_TEMP/release1710/SECURITY_REVIEW.md" app/build/production-evidence/
          echo "PRIVATE_GALLERY_1710_UPGRADE_FIXTURE=$PWD/docs/release1710/UpgradeFixtureTest.kt" >> "$GITHUB_ENV"
          echo "PRIVATE_GALLERY_1710_UPGRADE_FIXTURE_SHA256=$(sha256sum docs/release1710/UpgradeFixtureTest.kt | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Fetch immutable original signed code51 baseline
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const a=(await github.rest.actions.getArtifact({...context.repo,artifact_id:13081837273})).data;
            if(a.expired||a.workflow_run.id!==41301316948||a.workflow_run.head_sha!=='3fc699ae5ecfbc7678e835240c594e38daf4e1da')throw Error('Wrong baseline artifact');
            const r=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:a.id,archive_format:'zip'});
            const bytes=Buffer.from(r.data);
            if(crypto.createHash('sha256').update(bytes).digest('hex')!=='a7ad5e4d6c243e195a5d35db1f4a12711de1842bd6260aa318203e53ac691cb7')throw Error('Baseline archive changed');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/original179code51.zip',bytes);
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: home1710-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: evidencelocker179-${{ runner.os }}-
      - name: Prepare Android 17 SDK and pinned historical APK
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;22.0"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/previous-android-command-tools"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
          python3 scripts/verify_upgrade1710_baseline.py "$RUNNER_TEMP/original179code51.zip" "$RUNNER_TEMP/original179code51.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/original179code51.apk" > app/build/production-evidence/baseline-signature.txt
          grep -Fxq 'Signer #1 certificate SHA-256 digest: 94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17' app/build/production-evidence/baseline-signature.txt
          grep -Fxq 'Verified using v2 scheme (APK Signature Scheme v2): true' app/build/production-evidence/baseline-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/original179code51.apk" > app/build/production-evidence/baseline-package.txt
          grep -Fq "package: name='uk.co.traynor.privategallery' versionCode='51' versionName='1.7.9'" app/build/production-evidence/baseline-package.txt
          bash scripts/compile_upgrade1710_fixture.sh
      - name: Verify original production private key and certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: bash scripts/verify_permanent_signer.sh
      - name: Build frozen production release and verify package certificate and SHA256
        env:
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_FILE: ${{ runner.temp }}/private-gallery-release.jks
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: |
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          ./gradlew lintRelease assembleRelease --stacktrace
          bash scripts/verify_production_candidate.sh
          python3 scripts/verify_evidence179_distribution.py app/build/outputs/apk/release/app-release.apk arm64-v8a app/build/production-evidence/ocr-distribution.json
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk > app/build/production-evidence/alignment.txt
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Original-key code51 to code52 upgrade and restart without uninstalling
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PRIVATE_GALLERY_1710_BASELINE_APK: ${{ runner.temp }}/original179code51.apk
          PRODUCTION_UPGRADE: '1'
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_FILE: ${{ runner.temp }}/private-gallery-release.jks
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: bash scripts/verify_synthetic_upgrade1710.sh
      - name: Stage one signed owner acceptance APK after upgrade gates
        run: |
          test -s app/build/production-evidence/from51/upgrade-result.txt
          cp app/build/outputs/apk/release/app-release.apk app/build/Private-Gallery-1.7.10-code52-owner-acceptance.apk
          sha256sum app/build/Private-Gallery-1.7.10-code52-owner-acceptance.apk > app/build/production-evidence/owner-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: private-gallery-1.7.10-code52-owner-acceptance
          path: |
            app/build/Private-Gallery-1.7.10-code52-owner-acceptance.apk
            app/build/production-evidence
          if-no-files-found: error
