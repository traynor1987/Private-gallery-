name: NovaOS publish verified stable candidate
on:
  push:
    branches: [main]
    paths: ['.novaos-publish-authorization']
permissions:
  contents: read
  actions: read
concurrency:
  group: novaos-stable-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'traynor1987/Private-gallery-' && github.actor_id == '16270479' && github.event.sender.id == 16270479 && github.triggering_actor == 'traynor1987' && contains(github.event.head_commit.message, '[novaos-publish-authorization]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: novaos-production-publication
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Validate owner authorization
        run: |
          set -euo pipefail
          read -r approved < .novaos-publish-authorization
          test "$approved" = "${{ github.event.before }}"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $approved"
          test "$(git diff --name-only "$approved" HEAD)" = .novaos-publish-authorization
      - name: Obtain scoped tag credential when configured
        if: vars.NOVAOS_RELEASE_APP_ID != ''
        id: release-app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.NOVAOS_RELEASE_APP_ID }}
          private-key: ${{ secrets.NOVAOS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - name: Create or verify the exact stable tag
        env:
          GH_TOKEN: ${{ github.token }}
          NOVAOS_TAG_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/publish_verified_novaos.py --candidate .novaos-stable-candidate.json --preflight
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Install APK verification tools only
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Verify retained artifacts, publish, and confirm stable updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/publish_verified_novaos.py \
            --candidate .novaos-stable-candidate.json --work "$RUNNER_TEMP/novaos-stable-publication" \
            --tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Prepare disposable Android verification
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo chmod 666 /dev/kvm
          df -h
      - name: Verify authentic installed Build 84 through the live public in-app update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          avd-name: novaos85-live-public-update
          force-avd-creation: true
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: python3 docs/build85/verify_live_build84.py --candidate .novaos-stable-candidate.json --output "$RUNNER_TEMP/novaos85-live-public-evidence"
      - name: Retain actual public update UI and installed-version evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novaos85-live-public-update-evidence
          path: ${{ runner.temp }}/novaos85-live-public-evidence
          if-no-files-found: warn
          retention-days: 30
