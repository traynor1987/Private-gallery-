name: Private Gallery 1.7.6.2 upload picker check
on:
  push:
    branches: [release/1.7.6.2-ui-browser-polish]
    paths: ['.picker1762']
permissions:
  contents: read
jobs:
  picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: privacy1751-${{ runner.os }}-
      - name: Install Android 17 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
      - name: Assemble debug and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify picker on Android 17
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_atd
          arch: x86_64
          avd-name: picker1762
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: bash scripts/run_picker1762.sh
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-gallery-1762-picker
          path: |
            app/build/picker1762
            app/build/outputs/androidTest-results
          if-no-files-found: warn
