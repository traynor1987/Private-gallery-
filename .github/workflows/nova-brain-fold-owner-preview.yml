name: Assemble the NovaOS Fold owner preview
on:
  push:
    branches: [verification/nova-brain-fold-owner-preview]
    paths: [.github/workflows/nova-brain-fold-owner-preview.yml]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'traynor1987/Private-gallery-' && github.ref == 'refs/heads/verification/nova-brain-fold-owner-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REVIEWED_SOURCE: 53235901fa5dfdc5b4b5f3ab518b510028de28a9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: privacy1751-${{ runner.os }}-
      - name: Set up the reviewed Android 17 toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;22.0"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/previous-android-command-tools-intelligence"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version)" = 22.0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"
          python3 scripts/verify_android17_sdk.py "$ANDROID_HOME" "$RUNNER_TEMP/preview-sdk.json"
          bash scripts/prime_gradle95_ci.sh
      - name: Assemble only the isolated preview package
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          ./gradlew assembleDebug -Pkotlin.incremental=false --no-daemon --console=plain
      - name: Verify identity and encrypt the APK for private delivery
        run: |
          umask 077
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          out="$RUNNER_TEMP/nova-brain-fold-preview"
          mkdir "$out"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/preview-badging.txt"
          grep -Eq "^package: name='uk.co.traynor.privategallery.hiddenprototype' versionCode='[0-9]+' versionName='[^']+-TEST-ONLY'" "$RUNNER_TEMP/preview-badging.txt"
          grep -Fx "sdkVersion:'37'" "$RUNNER_TEMP/preview-badging.txt"
          grep -Fx "targetSdkVersion:'37'" "$RUNNER_TEMP/preview-badging.txt"
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/preview-signature.txt"
          "$tools/zipalign" -c -P 16 4 "$apk"
          cat > "$RUNNER_TEMP/preview-transfer.pem" <<'PUBLIC_CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIEKzCCApOgAwIBAgIUTYwRUYCnz0A19nPHzk3ooVNvAiowDQYJKoZIhvcNAQEL
          BQAwJTEjMCEGA1UEAwwaTm92YU9TIEZvbGQgYnVpbGQgdHJhbnNmZXIwHhcNMjYx
          MTIzMTEwNTEzWhcNMjYxMTI2MTEwNTEzWjAlMSMwIQYDVQQDDBpOb3ZhT1MgRm9s
          ZCBidWlsZCB0cmFuc2ZlcjCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCCAYoCggGB
          AIR6v54N74tKVjLTLTmfrWIvDwvK9iumkpvYfnQhW/82ALlptb0RdfrAtcai0hN+
