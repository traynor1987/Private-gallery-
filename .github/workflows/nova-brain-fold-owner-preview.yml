          aKairQrGPa7GgaNdrZhH
          -----END CERTIFICATE-----
          PUBLIC_CERTIFICATE
          openssl cms -encrypt -binary -aes-256-gcm -outform DER -in "$apk" \
            -out "$out/preview.apk.cms" "$RUNNER_TEMP/preview-transfer.pem"
          {
            printf 'source=%s\n' "$REVIEWED_SOURCE"
            printf 'sha256=%s\n' "$(sha256sum "$apk" | cut -d' ' -f1)"
            grep -E "^(package: |sdkVersion:|targetSdkVersion:)" "$RUNNER_TEMP/preview-badging.txt"
            grep -F 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/preview-signature.txt"
          } > "$out/receipt.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: nova-brain-fold-preview-encrypted
          path: ${{ runner.temp }}/nova-brain-fold-preview
          if-no-files-found: error
          retention-days: 1
