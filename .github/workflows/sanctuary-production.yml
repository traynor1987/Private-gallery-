name: NovaOS Code 81 protected production upgrade
on:
  push:
    branches: [main]
    paths: ['.novaos-production-authorization', '.novaos-build97-authorization']
permissions:
  contents: read
  actions: read
concurrency:
  group: production1762
  cancel-in-progress: false
jobs:
  sanctuary-production:
    if: github.repository == 'traynor1987/Private-gallery-' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor_id == '16270479' && github.event.sender.id == 16270479 && github.run_attempt == 1 && contains(github.event.head_commit.message, '[novaos-production-authorization]')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Preserve reviewed marker controls fixture and workflow before source checkout
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          source_root=Path.cwd();control=Path(os.environ['RUNNER_TEMP'])/'release1711-controls'
          inputs=Path(os.environ['RUNNER_TEMP'])/'release1711-inputs'
          assert not control.exists() and not inputs.exists()
          control.mkdir();inputs.mkdir()
          paths=['.sanctuary-production-candidate','.github/workflows/sanctuary-production.yml',
                 'docs/release1711/UpgradeFixtureTest.kt','docs/release1711/SECURITY_REVIEW.md',
                 'docs/release1711/RUNTIME_CASES.json']
          names=('compile_upgrade1711_fixture.sh','verify_compiled_upgrade1711.py','fetch_code81_upgrade_baseline.py','verify_code80_apk_identity.py','verify_code79_baseline.py','verify_novaos_release_assets.py','verify_production_candidate1711.sh','verify_synthetic_upgrade1711.sh','verify_signed_upgrade1711.py',
                 'release_configuration1711.sh','verify_release1711_gate.py','verify_backup_exclusions.py','rehearse_in_app_update85.py')
          paths+=['scripts/'+name for name in names]
          for name in paths:
              original=source_root/name
              assert original.is_file() and not original.is_symlink(), 'Missing original reviewed input: '+name
              destination=control/name;destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(original,destination)
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
          assert event['sender']['id']==16270479 and not event['forced'] and not event['created']
          approved_revision=Path('.novaos-production-authorization').read_text().strip()
          assert re.fullmatch('[a-f0-9]{40}',approved_revision) and approved_revision==event['before']
          head=os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-list','--parents','-n','1',head],text=True).split()==[head,approved_revision]
          assert subprocess.check_output(['git','diff','--name-only',approved_revision,head],text=True).splitlines()==['.novaos-production-authorization']
          marker=json.loads((control/'.sanctuary-production-candidate').read_bytes())
          assert re.fullmatch('[a-f0-9]{40}', marker['source']) and marker['source'] != '0'*40
          assert type(marker['test_run']) is int and marker['test_run'] > 0
          assert marker.get('runtime_branch', 'main') in ('main', 'feature/novaos-code81-core-apps', 'feature/novaos-code83-cloud-teacher', 'feature/novaos-guardian-retention89', 'feature/novaos-guardian-evidence90', 'feature/novaos-guardian-reliability91', 'feature/novaos-guardian-presentation93', 'feature/novaos-guardian-fold-acceptance')
          subprocess.run(['git','merge-base','--is-ancestor',marker['source'],head],check=True)
          assert re.fullmatch('[a-f0-9]{64}',marker['fixture_sha256'])
          workflow=hashlib.sha256((control/'.github/workflows/sanctuary-production.yml').read_bytes()).hexdigest()
          assert marker.get('workflow_sha256')==workflow, 'Signing workflow changed after review'
          review=(control/'docs/release1711/SECURITY_REVIEW.md').read_text()
          assert 'Signing workflow SHA-256: '+workflow in review.splitlines(), 'Missing exact workflow approval'
          (inputs/'owner-approval.json').write_text(json.dumps({
              'approving_login':event['sender']['login'],'approving_id':event['sender']['id'],
              'approved_revision':approved_revision,'approval_commit':head,
              'source':marker['source'],'version':'1.7.50','version_code':96,
              'workflow_sha256':workflow,'regression_run':marker['test_run'],
          },indent=2)+'\n')
          (inputs/'release-control-sha.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          (inputs/'preserved-inputs-sha256.json').write_text(json.dumps({name:hashlib.sha256((control/name).read_bytes()).hexdigest() for name in paths},indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('FROZEN_SOURCE='+marker['source']+'\n')
              output.write('PRIVATE_GALLERY_1711_UPGRADE_FIXTURE_SHA256='+marker['fixture_sha256']+'\n')
              settings={'PRIVATE_GALLERY_1711_ROOT':source_root,
                        'PRIVATE_GALLERY_1711_UPGRADE_FIXTURE':control/'docs/release1711/UpgradeFixtureTest.kt',
                        'PRIVATE_GALLERY_1711_GATE_RECEIPT':inputs/'gate.json',
                        'PRIVATE_GALLERY_1711_COMPILED_DIR':Path(os.environ['RUNNER_TEMP'])/'upgrade1711-compiled',
                        'PRIVATE_GALLERY_1711_BASELINE_APK':Path(os.environ['RUNNER_TEMP'])/'original1711code80.apk',
                        'PRIVATE_GALLERY_1711_SIGNED_INSTRUMENTATION_APK':Path(os.environ['RUNNER_TEMP'])/'release1711-signed/instrumentation.apk'}
              for name,value in settings.items(): output.write(name+'='+str(value)+'\n')
          PY
      - name: Fetch original exact-source runtime API evidence and baseline run provenance
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto'),path=require('path');
            const root=path.join(process.env.RUNNER_TEMP,'release1711-inputs');
            const marker=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'release1711-controls/.sanctuary-production-candidate'),'utf8'));
            const write=(name,value)=>fs.writeFileSync(path.join(root,name),JSON.stringify(value,null,2)+'\n');
            const hash=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
            if(context.repo.owner!=='traynor1987'||context.repo.repo!=='Private-gallery-'||context.eventName!=='push'||context.ref!=='refs/heads/main')throw Error('Wrong release context');
            if(!Number.isSafeInteger(marker.test_run)||marker.test_run<=0)throw Error('Missing immutable runtime run ID');
            const authorization=JSON.parse(fs.readFileSync(path.join(root,'owner-approval.json'),'utf8'));
            const approvalRun=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:context.runId})).data;
            if(approvalRun.event!=='push'||approvalRun.head_sha!==authorization.approval_commit||approvalRun.actor?.id!==16270479||approvalRun.run_attempt!==1||!approvalRun.created_at)throw Error('Owner authorization run mismatch');
            let run;
            const deadline=Date.now()+60*60_000;
            do {
              run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:marker.test_run})).data;
              if(run.head_sha!==marker.source||run.head_branch!==(marker.runtime_branch || 'main')||run.event!=='push'||run.head_repository?.full_name!=='traynor1987/Private-gallery-'||run.path.split('@')[0]!=='.github/workflows/fast-development.yml')throw Error('Runtime run is not the authorized candidate');
              if(run.status==='completed')break;
              if(Date.now()>=deadline)throw Error('Runtime verification did not finish before the deadline');
              await new Promise(resolve=>setTimeout(resolve,60_000));
            } while(true);
            write('github-run.json',run);
            if(run.head_sha!==marker.source||run.head_branch!==(marker.runtime_branch || 'main')||run.event!=='push'||run.status!=='completed'||run.conclusion!=='success'||run.head_repository?.full_name!=='traynor1987/Private-gallery-'||run.path.split('@')[0]!=='.github/workflows/fast-development.yml')throw Error('Runtime source/branch/workflow did not pass');
            const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id,per_page:100})).data;
            write('github-jobs.json',jobs);
            if(jobs.total_count!==jobs.jobs.length)throw Error('Incomplete original jobs response');
            const matching=jobs.jobs.filter(j=>j.name==='home2-integration');
            if(matching.length!==1||matching[0].conclusion!=='success'||matching[0].run_attempt!==run.run_attempt)throw Error('Missing successful integration job for latest attempt');
            if(!Number.isSafeInteger(marker.test_artifact)||marker.test_artifact<=0||!/^[a-f0-9]{64}$/.test(marker.runtime_archive_sha256))throw Error('Missing reviewed original runtime artifact identity');
            const artifact=(await github.rest.actions.getArtifact({...context.repo,artifact_id:marker.test_artifact})).data;
            write('github-artifact.json',artifact);
            const uploaded=Date.parse(artifact.created_at);
            const started=Date.parse(matching[0].started_at);
            const completed=Date.parse(matching[0].completed_at);
            if(artifact.id!==marker.test_artifact||artifact.expired||artifact.name!=='novaos-home2-integration-verification'||artifact.workflow_run?.id!==run.id||artifact.workflow_run?.head_sha!==marker.source||artifact.digest!=='sha256:'+marker.runtime_archive_sha256||!(started<=uploaded&&uploaded<=completed))throw Error('Runtime artifact does not match the reviewed successful attempt');
            write('verified-runtime-marker.json',marker);
            write('owner-approval.json',{...authorization,approved_at:approvalRun.created_at,approval_run:approvalRun.id,regression_artifact:artifact.id,regression_sha256:marker.runtime_archive_sha256});
            const runtime=Buffer.from((await github.rest.actions.downloadArtifact({...context.repo,artifact_id:artifact.id,archive_format:'zip'})).data);
            if(hash(runtime)!==marker.runtime_archive_sha256)throw Error('Original runtime archive changed');
            fs.writeFileSync(path.join(root,'original-runtime.zip'),runtime);
            const hidden=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:marker.hidden_test_run})).data;
            const hiddenJob=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:hidden.id,per_page:100})).data.jobs;
            if(hidden.event!=='push'||hidden.head_branch!=='main'||hidden.head_sha!==marker.source||hidden.head_repository?.full_name!=='traynor1987/Private-gallery-'||hidden.path.split('@')[0]!=='.github/workflows/hidden-space-development.yml'||hidden.status!=='completed'||hidden.conclusion!=='success'||hiddenJob.length!==1||hiddenJob[0].conclusion!=='success'||hiddenJob[0].run_attempt!==hidden.run_attempt)throw Error('Missing successful exact-source Hidden Space suite');
            const mandatory=['Verify protected core and camera','Compile and run JVM tests','Verify encrypted app adapters and concealed entry','Run Hidden and Primary regressions on Android 17'];
            if(mandatory.some(name=>!hiddenJob[0].steps.some(step=>step.name===name&&step.conclusion==='success')))throw Error('Mandatory Hidden Space test did not run');
            write('hidden-github-run.json',hidden);
            write('hidden-github-jobs.json',hiddenJob);
            const baselineRun=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:44942493458})).data;
            write('baseline-github-run.json',baselineRun);
            if(baselineRun.event!=='push'||baselineRun.head_branch!=='main'||baselineRun.head_repository?.full_name!=='traynor1987/Private-gallery-'||baselineRun.status!=='completed'||baselineRun.conclusion!=='success'||baselineRun.head_sha!=='ae79d321bbfbda77472d75710fb22bf73bd1e955'||baselineRun.path.split('@')[0]!=='.github/workflows/sanctuary-production.yml')throw Error('Pinned Build 95 production run differs');
      - name: Validate original runtime reports and authenticated owner authorization before signer access
        run: |
          controls="$RUNNER_TEMP/release1711-controls"
          inputs="$RUNNER_TEMP/release1711-inputs"
          python3 "$controls/scripts/verify_release1711_gate.py" \
            --marker "$inputs/verified-runtime-marker.json" --review "$controls/docs/release1711/SECURITY_REVIEW.md" \
            --run "$inputs/github-run.json" --jobs "$inputs/github-jobs.json" --artifact "$inputs/github-artifact.json" \
            --runtime-archive "$inputs/original-runtime.zip" --matrix "$controls/docs/release1711/RUNTIME_CASES.json" \
            --output "$PRIVATE_GALLERY_1711_GATE_RECEIPT"
          git cat-file -e "$FROZEN_SOURCE^{commit}"
          git checkout --detach "$FROZEN_SOURCE"
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          mkdir -p app/build/production-evidence
          cp "$inputs/gate.json" "$inputs/release-control-sha.txt" "$inputs/preserved-inputs-sha256.json" "$inputs/owner-approval.json" app/build/production-evidence/
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: privacy1751-${{ runner.os }}-
      - name: Install Android 17 tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;22.0"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/previous-android-command-tools1711"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
      - name: Prepare checksum-verified Gradle wrapper distribution
        run: bash scripts/prime_gradle95_ci.sh
      - name: Compile reviewed baseline-compatible fixture with no signing environment
        run: |
          controls="$RUNNER_TEMP/release1711-controls/scripts"
          python3 "$controls/verify_release1711_gate.py" --receipt "$PRIVATE_GALLERY_1711_GATE_RECEIPT" --source "$FROZEN_SOURCE"
          bash "$controls/compile_upgrade1711_fixture.sh"
          python3 "$controls/verify_compiled_upgrade1711.py" --directory "$PRIVATE_GALLERY_1711_COMPILED_DIR" --source "$FROZEN_SOURCE" --fixture "$PRIVATE_GALLERY_1711_UPGRADE_FIXTURE" --compiler "$controls/compile_upgrade1711_fixture.sh"
          chmod -R a-w "$PRIVATE_GALLERY_1711_COMPILED_DIR"
      - name: Verify published Build 95 baseline before signer access
        run: |
          controls="$RUNNER_TEMP/release1711-controls/scripts"
          python3 "$controls/fetch_code81_upgrade_baseline.py" "$PRIVATE_GALLERY_1711_BASELINE_APK" "$ANDROID_HOME/build-tools/36.0.0" | tee app/build/production-evidence/baseline-archive-validation.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$PRIVATE_GALLERY_1711_BASELINE_APK" > app/build/production-evidence/baseline-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PRIVATE_GALLERY_1711_BASELINE_APK" > app/build/production-evidence/baseline-package.txt
      # Existing permanent credentials are introduced only after original runtime/review and compilation pass.
      - name: Verify the existing permanent private key and original certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: |
          source "$RUNNER_TEMP/release1711-controls/scripts/release_configuration1711.sh"
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          : "${KEYSTORE_BASE64:?Original signer unavailable}" "${STORE_PASSWORD:?}" "${KEY_ALIAS:?}" "${KEY_PASSWORD:?}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/private-gallery-release.jks"
          probe=$(mktemp -d "$RUNNER_TEMP/signer1711.XXXXXX")
          trap 'rm -rf "$probe"' EXIT
          keytool -exportcert -keystore "$RUNNER_TEMP/private-gallery-release.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" -file "$probe/cert.der" >/dev/null 2>&1
          test "$(sha256sum "$probe/cert.der" | cut -d ' ' -f 1)" = 94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17
          printf 'Original NovaOS private-key availability probe\n' > "$probe/probe.txt"
          jar cf "$probe/probe.jar" -C "$probe" probe.txt
          jarsigner -keystore "$RUNNER_TEMP/private-gallery-release.jks" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD "$probe/probe.jar" "$KEY_ALIAS" >/dev/null 2>&1
          jarsigner -verify "$probe/probe.jar" > "$probe/verification.txt"
          grep -q 'jar verified' "$probe/verification.txt"
          printf 'PASS: existing permanent private key; original certificate SHA256 94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17\n' > app/build/production-evidence/permanent-signer.txt
      - name: Build the frozen original-key NovaOS 1.7.50 candidate
        env:
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_FILE: ${{ runner.temp }}/private-gallery-release.jks
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: |
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          ./gradlew lintRelease assembleRelease --stacktrace --no-daemon --console=plain
      - name: Sign a disposable copy of the already compiled instrumentation and verify its payload
        env:
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/private-gallery-release.jks"' EXIT
          controls="$RUNNER_TEMP/release1711-controls/scripts"
          python3 "$controls/verify_compiled_upgrade1711.py" --directory "$PRIVATE_GALLERY_1711_COMPILED_DIR" --source "$FROZEN_SOURCE" --fixture "$PRIVATE_GALLERY_1711_UPGRADE_FIXTURE" --compiler "$controls/compile_upgrade1711_fixture.sh"
          mkdir "$RUNNER_TEMP/release1711-signed"
          cp "$PRIVATE_GALLERY_1711_COMPILED_DIR/instrumentation.apk" "$PRIVATE_GALLERY_1711_SIGNED_INSTRUMENTATION_APK"
          chmod u+w "$PRIVATE_GALLERY_1711_SIGNED_INSTRUMENTATION_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/private-gallery-release.jks" --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --min-sdk-version 24 "$PRIVATE_GALLERY_1711_SIGNED_INSTRUMENTATION_APK"
          python3 "$controls/verify_signed_upgrade1711.py" "$PRIVATE_GALLERY_1711_COMPILED_DIR/instrumentation.apk" "$PRIVATE_GALLERY_1711_SIGNED_INSTRUMENTATION_APK" | tee app/build/production-evidence/instrumentation-payload-validation.txt
      - name: Verify frozen candidate package signature OCR distribution and 16KiB alignment
        run: |
          bash "$RUNNER_TEMP/release1711-controls/scripts/verify_production_candidate1711.sh"
          python3 "$RUNNER_TEMP/release1711-controls/scripts/verify_backup_exclusions.py" --project "$PWD" --apk app/build/outputs/apk/release/app-release.apk --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          python3 scripts/verify_evidence179_distribution.py app/build/outputs/apk/release/app-release.apk arm64-v8a,x86_64 app/build/production-evidence/ocr-distribution.json
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk > app/build/production-evidence/alignment.txt
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Original-key Build 95 to versionCode 96 upgrade and restart without uninstall or clear
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PRODUCTION_UPGRADE: '1'
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          avd-name: novaos1711-original-key-from80
          force-avd-creation: true
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: bash "$RUNNER_TEMP/release1711-controls/scripts/verify_synthetic_upgrade1711.sh"
      - name: Record verified disposable upgrade without distributing the APK
        run: |
          evidence=app/build/production-evidence
          upgrade="$evidence/from80"
          grep -q '^PASS:' "$upgrade/upgrade-result.txt"
          test "$(cat "$upgrade/upgrade-candidate-source-sha.txt")" = "$FROZEN_SOURCE"
          sha256sum -c "$evidence/apk-sha256.txt"
          for phase in seed verify after-restart; do
            grep -Fx 'OK (1 test)' "$upgrade/upgrade-$phase.txt"
          done
          cat "$evidence/package.txt" "$evidence/signature.txt" "$evidence/apk-sha256.txt" "$upgrade/upgrade-result.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve verified upgrade receipts only
        uses: actions/upload-artifact@v4
        with:
          name: novaos-code81-production-upgrade-receipts
          path: |
            app/build/production-evidence/baseline-archive-validation.txt
            app/build/production-evidence/package.txt
            app/build/production-evidence/signature.txt
            app/build/production-evidence/apk-sha256.txt
            app/build/production-evidence/source-sha.txt
            app/build/production-evidence/owner-approval.json
            app/build/production-evidence/from80/*.txt
            app/build/production-evidence/from80/in-app-update.json
            app/build/production-evidence/from80/in-app-installer-ui.xml
          if-no-files-found: error
          retention-days: 30
      - name: Stage and verify stable update assets
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/code81-release"
          mkdir -m 0700 "$stage"
          cp app/build/outputs/apk/release/app-release.apk "$stage/private-gallery-release.apk"
          (cd "$stage" && sha256sum private-gallery-release.apk > private-gallery-release.apk.sha256)
          install -m 0600 /dev/null "$stage/notes.md"
          cat > "$stage/notes.md" <<'NOTES'
          NovaOS 1.7.50 (Build 96), Android 17.
          Hidden Space opens directly into the full workspace after PIN unlock. Primary and Hidden use the existing Labs apps with separate authenticated data.
          The known Galaxy Z Fold Guardian replacement-notification issue from Build 95 remains open.
          NOTES
          python3 - "$stage" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          digest=(root/'private-gallery-release.apk.sha256').read_text().split()[0]
          (root/'private-gallery-release.metadata.json').write_text(json.dumps({
            'package':'uk.co.traynor.privategallery','versionName':'1.7.50','versionCode':96,
            'certificateSha256':'94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17',
            'apkSha256':digest,
          },indent=2)+'\n')
          PY
          if ! git show-ref --verify --quiet refs/tags/v1.7.50; then
            git tag v1.7.50 "$FROZEN_SOURCE"
          fi
          python3 "$RUNNER_TEMP/release1711-controls/scripts/verify_novaos_release_assets.py" \
            --tag v1.7.50 --source "$FROZEN_SOURCE" --baseline-code 95 \
            --assets "$stage" --notes "$stage/notes.md" --tools "$ANDROID_HOME/build-tools/36.0.0" \
            --evidence app/build/production-evidence/from80
      - name: Retain verified publication inputs
        uses: actions/upload-artifact@v4
        with:
          name: novaos-code81-verified-stable-assets
          path: |
            ${{ runner.temp }}/code81-release/private-gallery-release.apk
            ${{ runner.temp }}/code81-release/private-gallery-release.apk.sha256
            ${{ runner.temp }}/code81-release/private-gallery-release.metadata.json
            ${{ runner.temp }}/code81-release/notes.md
          if-no-files-found: error
          retention-days: 7
      - name: Remove original signing material on every outcome
        if: always()
        run: rm -f "$RUNNER_TEMP/private-gallery-release.jks"
      - name: Select failed diagnostics without any APK archive or signing material
        if: failure()
        run: |
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          temporary=Path(os.environ['RUNNER_TEMP']);destination=temporary/'release1711-failure';destination.mkdir(exist_ok=True)
          evidence=Path('app/build/production-evidence');inputs=temporary/'release1711-inputs'
          for name in ('github-run.json','github-jobs.json','github-artifact.json','baseline-github-run.json','hidden-github-run.json','hidden-github-jobs.json','gate.json','release-control-sha.txt','preserved-inputs-sha256.json'):
              original=inputs/name
              if original.is_file() and not original.is_symlink(): shutil.copyfile(original,destination/name)
          for name in ('baseline-signature.txt','baseline-package.txt','baseline-archive-validation.txt','signature.txt','package.txt','source-sha.txt','apk-sha256.txt','ocr-distribution.json','alignment.txt','instrumentation-payload-validation.txt','release-summary.json'):
              original=evidence/name
              if original.is_file() and not original.is_symlink(): shutil.copyfile(original,destination/name)
          for name in ('upgrade-baseline-package.txt','upgrade-candidate-package.txt','upgrade-baseline-signature.txt','upgrade-candidate-signature.txt','upgrade-instrumentation-signature.txt','upgrade-compilation.json','upgrade-seed.txt','upgrade-verify.txt','upgrade-after-restart.txt','upgrade-result.txt','in-app-update.json','in-app-update-instrumentation.txt','in-app-installer-ui.xml','in-app-installer-wait.txt','in-app-installer-window.txt','in-app-installer-activity.txt'):
              original=evidence/'from80'/name
              if original.is_file() and not original.is_symlink(): shutil.copyfile(original,destination/name)
          for name in ('lint-results-release.html','lint-results-release.xml'):
              original=Path('app/build/reports')/name
              if original.is_file() and not original.is_symlink(): shutil.copyfile(original,destination/name)
          PY
      - name: Preserve only selected failed release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: novaos1711-production-failure-diagnostics
          path: ${{ runner.temp }}/release1711-failure
          if-no-files-found: warn

  build97-protected:
    if: >-
      github.repository == 'traynor1987/Private-gallery-' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor_id == '16270479' && github.event.sender.id == 16270479 &&
      github.triggering_actor == 'traynor1987' && github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[novaos-build97-authorization]')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Validate Build 97 owner authorization and exact evidence before signer access
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/novaos97/receipts"
          python3 scripts/novaos_build97_gate.py authorize "$RUNNER_TEMP/novaos97/receipts"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: privacy1751-${{ runner.os }}-
      - name: Install and verify the same Android 17 tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;22.0"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/previous-android-command-tools97"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version)" = 22.0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
          python3 scripts/verify_android17_sdk.py "$ANDROID_HOME" "$RUNNER_TEMP/novaos97/receipts/android17-sdk.json"
      - name: Prepare the Build 96 baseline and upgrade fixture without signing access
        env:
          FROZEN_SOURCE: ${{ steps.authorize.outputs.source }}
        run: |
          root="$RUNNER_TEMP/novaos97"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          baseline=6d91450aac55c805df5d6f0bac20164b09697ab2
          python3 scripts/novaos_build97_gate.py baseline "$root/baseline.apk" "$tools"
          git worktree add --detach "$root/source" "$FROZEN_SOURCE"
          test "$(git -C "$root/source" rev-parse HEAD)" = "$FROZEN_SOURCE"
          python3 scripts/verify_backup_exclusions.py --project "$root/source"
          bash scripts/prime_gradle95_ci.sh
          mkdir -m 0700 "$root/baseline-source"
          git archive "$baseline" | tar -x -C "$root/baseline-source"
          cmp "$root/source/gradle/wrapper/gradle-wrapper.jar" "$root/baseline-source/gradle/wrapper/gradle-wrapper.jar"
          cmp "$root/source/gradle/wrapper/gradle-wrapper.properties" "$root/baseline-source/gradle/wrapper/gradle-wrapper.properties"
          python3 scripts/novaos_build97_gate.py fixture "$root/baseline-source"
          (cd "$root/baseline-source" && ./gradlew assembleDebugAndroidTest --no-daemon -Pkotlin.incremental=false --console=plain)
          install -m 0400 "$root/baseline-source/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" "$root/compiled-instrumentation.apk"
          "$tools/aapt" dump badging "$root/compiled-instrumentation.apk" > "$root/fixture-package.txt"
          "$tools/aapt" dump xmltree "$root/compiled-instrumentation.apk" AndroidManifest.xml > "$root/fixture-manifest.txt"
          grep -Fq "package: name='uk.co.traynor.privategallery.test'" "$root/fixture-package.txt"
          test "$(grep -Ec '^\s*E: instrumentation\b' "$root/fixture-manifest.txt")" = 1
          test "$(grep -Ec 'A: android:targetPackage\([^)]*\)="uk\.co\.traynor\.privategallery"' "$root/fixture-manifest.txt")" = 1
          test "$(grep -Ec 'A: android:name\([^)]*\)="androidx\.test\.runner\.AndroidJUnitRunner"' "$root/fixture-manifest.txt")" = 1
          sha256sum "$root/compiled-instrumentation.apk" > "$root/instrumentation.sha256"
          rm -rf -- "$root/baseline-source"
      - name: Verify original production identity and sign the frozen Build 97 source
        env:
          FROZEN_SOURCE: ${{ steps.authorize.outputs.source }}
          KEYSTORE_BASE64: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Original signer missing}" "${STORE_PASSWORD:?Missing signer password}" "${KEY_ALIAS:?Missing signer alias}" "${KEY_PASSWORD:?Missing key password}"
          root="$RUNNER_TEMP/novaos97"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test "$(git -C "$root/source" rev-parse HEAD)" = "$FROZEN_SOURCE"
          git -C "$root/source" diff --quiet HEAD --
          sha256sum -c "$root/instrumentation.sha256"
          umask 077
          signer=$(mktemp -d "$root/key.XXXXXXXX")
          trap 'rm -rf -- "$signer"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signer/original.jks"
          unset KEYSTORE_BASE64
          keytool -exportcert -keystore "$signer/original.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" -file "$signer/cert.der" >/dev/null
          test "$(sha256sum "$signer/cert.der" | cut -d ' ' -f 1)" = 94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17
          (
            cd "$root/source"
            export ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_FILE="$signer/original.jks"
            export ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_PASSWORD="$STORE_PASSWORD"
            export ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_ALIAS="$KEY_ALIAS"
            export ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_PASSWORD="$KEY_PASSWORD"
            ./gradlew lintRelease assembleRelease --stacktrace --no-daemon --console=plain
          )
          install -m 0400 "$root/source/app/build/outputs/apk/release/app-release.apk" "$root/candidate.apk"
          "$tools/apksigner" sign --ks "$signer/original.jks" --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD --min-sdk-version 37 --out "$root/instrumentation.apk" "$root/compiled-instrumentation.apk"
      - name: Verify the signed Build 97 APK and protected packaging
        run: |
          root="$RUNNER_TEMP/novaos97"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          python3 scripts/novaos_build97_gate.py candidate "$root/candidate.apk" "$tools" > "$root/receipts/candidate-sha256.txt"
          python3 scripts/verify_signed_upgrade1711.py "$root/compiled-instrumentation.apk" "$root/instrumentation.apk"
          "$tools/apksigner" verify --verbose --print-certs "$root/instrumentation.apk" > "$root/receipts/instrumentation-signature.txt"
          grep -Fx 'Number of signers: 1' "$root/receipts/instrumentation-signature.txt"
          grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$root/receipts/instrumentation-signature.txt"
          grep -Fx 'Signer #1 certificate SHA-256 digest: 94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17' "$root/receipts/instrumentation-signature.txt"
          "$tools/zipalign" -c -P 16 4 "$root/candidate.apk"
          python3 scripts/verify_backup_exclusions.py --project "$root/source" --apk "$root/candidate.apk" --aapt2 "$tools/aapt2"
          python3 scripts/verify_evidence179_distribution.py "$root/candidate.apk" arm64-v8a,x86_64 "$root/receipts/ocr-distribution.json"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Rehearse populated Build 96 to 97 upgrade and restart through the in-app updater
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FROZEN_SOURCE: ${{ steps.authorize.outputs.source }}
          PRODUCTION_UPGRADE: '1'
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          avd-name: novaos97-original-key-upgrade
          force-avd-creation: true
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: bash scripts/run_build97_upgrade.sh
      - name: Retain only non-sensitive Build 97 verification receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novaos-build97-${{ steps.authorize.outputs.mode }}-receipts
          path: ${{ runner.temp }}/novaos97/receipts
          if-no-files-found: error
          retention-days: 30
      - name: Stage verified Build 97 stable assets
        if: steps.authorize.outputs.mode == 'production'
        run: |
          root="$RUNNER_TEMP/novaos97"
          mkdir -m 0700 "$root/assets"
          install -m 0600 "$root/candidate.apk" "$root/assets/private-gallery-release.apk"
          python3 - "$root" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root = Path(sys.argv[1])
          dest = root / "assets"
          with (dest / "private-gallery-release.apk").open("rb") as apk:
              digest = hashlib.file_digest(apk, "sha256").hexdigest()
          assert digest == (root / "receipts/candidate-sha256.txt").read_text().strip()
          (dest / "private-gallery-release.apk.sha256").write_text(digest + "  private-gallery-release.apk\n")
          (dest / "private-gallery-release.metadata.json").write_text(json.dumps({
              "package": "uk.co.traynor.privategallery", "versionName": "1.7.51", "versionCode": 97,
              "apkSha256": digest,
              "certificateSha256": "94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17",
          }, indent=2) + "\n")
          (dest / "notes.md").write_text(
              "NovaOS 1.7.51 (Build 97), Android 17.\n\n"
              "Nova Intelligence adds the launcher dashboard, local Ask Nova commands, a Guardian summary, tasks, calendar and encrypted assistant memory.\n\n"
              "Owner Preview is available in Settings → Nova Brain for two manually approved synthetic tests. It starts off and uses its own connection.\n"
          )
          PY
      - name: Retain verified Build 97 production publication inputs
        if: steps.authorize.outputs.mode == 'production'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novaos-build97-verified-stable-assets
          path: ${{ runner.temp }}/novaos97/assets
          if-no-files-found: error
          retention-days: 7
      - name: Remove all Build 97 key and APK material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/novaos97"
