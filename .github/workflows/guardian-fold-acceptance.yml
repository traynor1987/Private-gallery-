name: Guardian Fold notification regression
on:
  push:
    branches: [feature/novaos-guardian-fold-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardian-api37:
    if: github.ref == 'refs/heads/feature/novaos-guardian-fold-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: privacy1751-${{ runner.os }}-
      - name: Provision checked Android 17 and Gradle tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;22.0"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/previous-android-command-tools-guardian"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version)" = 22.0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
          bash scripts/prime_gradle95_ci.sh
          sudo chmod 666 /dev/kvm
      - name: Build and test the isolated Guardian app
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest -Pkotlin.incremental=false --no-daemon --console=plain
      - name: Run grouped notifications through the Android listener
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: |
            adb shell wm size 1200x1800
            adb shell wm density 160
            adb shell settings put secure show_ime_with_hard_keyboard 1
            bash scripts/run_guardian_notification_pipeline93.sh GuardianFoldNotificationTest guardian-fold-notification
            bash scripts/run_guardian_notification_pipeline93.sh
            bash scripts/run_visual_checkpoint.sh GuardianNotificationCompatibility77Test guardian-notification-compatibility-77 uk.co.traynor.privategallery.core.guardian
            bash scripts/run_visual_checkpoint.sh GuardianCaptureStore77Test guardian-capture-store-77 uk.co.traynor.privategallery.core.guardian
            bash scripts/run_visual_checkpoint.sh GuardianEvidence90RuntimeTest guardian-evidence-90 uk.co.traynor.privategallery.core.guardian
            bash scripts/run_visual_checkpoint.sh GuardianInbox77UiTest guardian-inbox-77 uk.co.traynor.privategallery.launcher
            bash scripts/run_visual_checkpoint.sh SanctuaryGuardianUiTest sanctuary-guardian
            bash scripts/run_visual_checkpoint.sh SanctuaryDndUiTest sanctuary-dnd
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-fold-api37-reports
          path: |
            app/build/home2-evidence/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
