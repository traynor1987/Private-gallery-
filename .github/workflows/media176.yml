name: 1.7.6 focused media management
on:
  push:
    branches: [release/1.7.6-media-management]
    paths: ['.media176-focused']
permissions:
  contents: read
concurrency:
  group: media176-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: privacy1751-${{ runner.os }}-
      - name: Host selection and existing security checks
        run: |
          java com.sun.tools.javac.Main -d /tmp/selection176 app/src/main/java/uk/co/traynor/privategallery/core/ui/MediaSelection.java scripts/tests/MediaSelectionChecks.java
          java -cp /tmp/selection176 MediaSelectionChecks
          java com.sun.tools.javac.Main -d /tmp/journal176 app/src/main/java/uk/co/traynor/privategallery/core/hidden/HiddenRecordStore.java app/src/main/java/uk/co/traynor/privategallery/core/hidden/TransferJournal.java scripts/tests/TransferJournalChecks.java
          java -cp /tmp/journal176 TransferJournalChecks
          python3 -m unittest discover -s scripts/tests
          bash scripts/no_secret_scan.sh
          bash scripts/check_hidden_foundation.sh
          bash scripts/check_camera.sh
          bash scripts/check_hidden_browser.sh
      - name: Install SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
      - name: Compile all sources and run JVM and lint
        run: ./gradlew compileDebugAndroidTestKotlin testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android 16 focused selection and transfer
        id: api36
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_atd
          arch: x86_64
          avd-name: media176-36
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 36
            adb shell wm size 840x900
            adb shell wm density 160
            bash scripts/run_repair1751_focused.sh api36 uk.co.traynor.privategallery.core.hidden.PrimaryCopyAccessTest,uk.co.traynor.privategallery.core.hidden.HiddenRestoreAccessTest,uk.co.traynor.privategallery.ui.MediaSelection176Test,uk.co.traynor.privategallery.ui.GalleryProfessional171Test
            python3 scripts/verify_professional_ui_results.py app/build/outputs/androidTest-results/connected/debug uk.co.traynor.privategallery.core.hidden.PrimaryCopyAccessTest#journalResumesCommitBeforeVerificationWithoutCreatingDuplicate,uk.co.traynor.privategallery.core.hidden.PrimaryCopyAccessTest#journalResolvesSourceAlreadyTrashedAfterMoveCommit,uk.co.traynor.privategallery.core.hidden.PrimaryCopyAccessTest#journalCancellationSurvivesNewAccessAndRetainsRemainingOriginals,uk.co.traynor.privategallery.core.hidden.HiddenRestoreAccessTest#hiddenMoveResumesVerifiedCopyWithFreshAuthenticationWithoutDuplicate,uk.co.traynor.privategallery.core.hidden.HiddenRestoreAccessTest#closingHistoryOwnerSynchronouslyRevokesReverseResume,uk.co.traynor.privategallery.core.hidden.HiddenRestoreAccessTest#reverseCancellationAtRemovalBoundaryPreservesOriginal,uk.co.traynor.privategallery.ui.MediaSelection176Test#dateSelectionIncludesBothLocalBoundariesAndNeverAddsOutsideScope,uk.co.traynor.privategallery.ui.MediaSelection176Test#sizeSelectionUsesMetadataAndStrictPresetBoundary
      - name: Android 17 focused selection and transfer
        id: api37
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_atd
          arch: x86_64
          avd-name: media176-37
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 37
            adb shell wm size 840x900
            adb shell wm density 160
            bash scripts/run_repair1751_focused.sh api37 uk.co.traynor.privategallery.core.hidden.PrimaryCopyAccessTest,uk.co.traynor.privategallery.core.hidden.HiddenRestoreAccessTest,uk.co.traynor.privategallery.ui.MediaSelection176Test,uk.co.traynor.privategallery.ui.GalleryProfessional171Test
            python3 scripts/verify_professional_ui_results.py app/build/outputs/androidTest-results/connected/debug uk.co.traynor.privategallery.core.hidden.PrimaryCopyAccessTest#journalResumesCommitBeforeVerificationWithoutCreatingDuplicate,uk.co.traynor.privategallery.core.hidden.PrimaryCopyAccessTest#journalResolvesSourceAlreadyTrashedAfterMoveCommit,uk.co.traynor.privategallery.core.hidden.PrimaryCopyAccessTest#journalCancellationSurvivesNewAccessAndRetainsRemainingOriginals,uk.co.traynor.privategallery.core.hidden.HiddenRestoreAccessTest#hiddenMoveResumesVerifiedCopyWithFreshAuthenticationWithoutDuplicate,uk.co.traynor.privategallery.core.hidden.HiddenRestoreAccessTest#closingHistoryOwnerSynchronouslyRevokesReverseResume,uk.co.traynor.privategallery.core.hidden.HiddenRestoreAccessTest#reverseCancellationAtRemovalBoundaryPreservesOriginal,uk.co.traynor.privategallery.ui.MediaSelection176Test#dateSelectionIncludesBothLocalBoundariesAndNeverAddsOutsideScope,uk.co.traynor.privategallery.ui.MediaSelection176Test#sizeSelectionUsesMetadataAndStrictPresetBoundary
      - name: Require both platform results
        if: always()
        run: |
          test '${{ steps.api36.outcome }}' = success
          test '${{ steps.api37.outcome }}' = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media176-focused-evidence
          path: |
            app/build/refinement1751
            app/build/test-results
            app/build/reports
          if-no-files-found: warn
