name: Phase 1 setup admission RED evidence
on:
  push:
    branches: [phase1/setup-admission-red]
permissions:
  contents: read
jobs:
  pre-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "emulator"
      - run: ./gradlew assembleDebug assembleDebugAndroidTest
      - run: sudo chmod 666 /dev/kvm
      - name: Observe expected pre-fix assertion failures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_atd
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=uk.co.traynor.privategallery.core.security.Phase1PrimarySlotsTest#inaccessibleNestedPrimaryMaterialCannotPermitFreshKeyCreation,uk.co.traynor.privategallery.core.security.Phase1PrimarySlotsTest#inaccessibleEmptyNestedDirectoryCannotPermitFreshKeyCreation,uk.co.traynor.privategallery.core.security.Phase1PrimarySlotsTest#unsearchableNestedDirectoryCannotBeMistakenForEmpty,uk.co.traynor.privategallery.core.security.Phase1PrimarySlotsTest#unsearchableEmptyDirectoryCannotAuthorizeInitialSetup,uk.co.traynor.privategallery.core.security.Phase1PrimarySlotsTest#setupCannotSaveCredentialsWhileRestoreOwnsPrimaryTransaction,uk.co.traynor.privategallery.core.security.Phase1PrimarySlotsTest#genuineEmptyInstallationStillCreatesAndUnlocksSamePrimaryKey --stacktrace || true
            python3 -c "import pathlib,xml.etree.ElementTree as E; r=[E.parse(p).getroot() for p in pathlib.Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml')]; cases=[t for x in r for t in x.iter('testcase')]; failures={t.get('name') for t in cases if t.find('failure') is not None}; assert len(cases)==6; assert failures=={'inaccessibleNestedPrimaryMaterialCannotPermitFreshKeyCreation','inaccessibleEmptyNestedDirectoryCannotPermitFreshKeyCreation','unsearchableNestedDirectoryCannotBeMistakenForEmpty','unsearchableEmptyDirectoryCannotAuthorizeInitialSetup','setupCannotSaveCredentialsWhileRestoreOwnsPrimaryTransaction'}; assert not any(t.find('error') is not None for t in cases); print('RED observed: five setup-admission assertions fail; genuine-empty setup passes on superseded unchanged production source')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-setup-admission-red-evidence
          path: app/build/outputs/androidTest-results
