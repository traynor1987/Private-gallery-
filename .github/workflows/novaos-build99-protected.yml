name: NovaOS Build 99 protected signing and upgrade
on:
  push:
    branches: [main]
    paths: ['.novaos-build99-rehearsal-authorization', '.novaos-build99-production-authorization']
permissions: {}
concurrency:
  group: novaos-build99-protected
  cancel-in-progress: false
jobs:
  build99-protected:
    if: >-
      github.repository == 'traynor1987/Private-gallery-' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor_id == '16270479' && github.event.sender.id == 16270479 &&
      github.triggering_actor == 'traynor1987' && github.run_attempt == 1 &&
      (contains(github.event.head_commit.message, '[novaos-build99-rehearsal-authorization]') ||
       contains(github.event.head_commit.message, '[novaos-build99-production-authorization]'))
    name: Build 99 protected
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Validate Build 99 owner authorization and exact evidence before signer access
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          receipts="$RUNNER_TEMP/novaos99/receipts"
          install -d -m 0700 "$receipts"
          rehearsal='[novaos-build99-rehearsal-authorization]'
          production='[novaos-build99-production-authorization]'
          if [[ "$MARKER_MESSAGE" == *"$rehearsal"* && "$MARKER_MESSAGE" != *"$production"* ]]; then
            python3 scripts/novaos_build99_rehearsal.py authorize "$receipts"
          elif [[ "$MARKER_MESSAGE" == *"$production"* && "$MARKER_MESSAGE" != *"$rehearsal"* ]]; then
            python3 scripts/novaos_build99_production.py authorize "$receipts"
          else
            echo 'Expected exactly one authenticated Build 99 authorization mode.' >&2
            exit 1
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: privacy1751-${{ runner.os }}-
      - name: Install and verify the same Android 17 tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;22.0"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/previous-android-command-tools97"
          ln -s "$ANDROID_HOME/cmdline-tools/22.0" "$ANDROID_HOME/cmdline-tools/latest"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version)" = 22.0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "emulator"
          python3 scripts/verify_android17_sdk.py "$ANDROID_HOME" "$RUNNER_TEMP/novaos99/receipts/android17-sdk.json"
      - name: Prepare the Build 97 baseline and upgrade fixture without signing access
        env:
          FROZEN_SOURCE: ${{ steps.authorize.outputs.source }}
        run: |
          root="$RUNNER_TEMP/novaos99"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          baseline=6b7f1bbe40db3f213ff087833f37e05954e1c792
          python3 scripts/novaos_build99_rehearsal.py baseline "$root/baseline.apk" "$tools"
          git worktree add --detach "$root/source" "$FROZEN_SOURCE"
          test "$(git -C "$root/source" rev-parse HEAD)" = "$FROZEN_SOURCE"
          python3 scripts/verify_backup_exclusions.py --project "$root/source"
          bash scripts/prime_gradle95_ci.sh
          mkdir -m 0700 "$root/baseline-source"
          git archive "$baseline" | tar -x -C "$root/baseline-source"
          cmp "$root/source/gradle/wrapper/gradle-wrapper.jar" "$root/baseline-source/gradle/wrapper/gradle-wrapper.jar"
          cmp "$root/source/gradle/wrapper/gradle-wrapper.properties" "$root/baseline-source/gradle/wrapper/gradle-wrapper.properties"
          python3 scripts/novaos_build99_rehearsal.py fixture "$root/baseline-source"
          (cd "$root/baseline-source" && ./gradlew assembleDebugAndroidTest --no-daemon -Pkotlin.incremental=false --console=plain)
          install -m 0400 "$root/baseline-source/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" "$root/compiled-instrumentation.apk"
          "$tools/aapt" dump badging "$root/compiled-instrumentation.apk" > "$root/fixture-package.txt"
          "$tools/aapt" dump xmltree "$root/compiled-instrumentation.apk" AndroidManifest.xml > "$root/fixture-manifest.txt"
          grep -Fq "package: name='uk.co.traynor.privategallery.test'" "$root/fixture-package.txt"
          test "$(grep -Ec '^\s*E: instrumentation\b' "$root/fixture-manifest.txt")" = 1
          test "$(grep -Ec 'A: android:targetPackage\([^)]*\)="uk\.co\.traynor\.privategallery"' "$root/fixture-manifest.txt")" = 1
          test "$(grep -Ec 'A: android:name\([^)]*\)="androidx\.test\.runner\.AndroidJUnitRunner"' "$root/fixture-manifest.txt")" = 1
          sha256sum "$root/compiled-instrumentation.apk" > "$root/instrumentation.sha256"
          rm -rf -- "$root/baseline-source"
      - name: Recheck owner authorization and unsigned fixture before signer access
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_SOURCE: ${{ steps.authorize.outputs.source }}
          RELEASE_MODE: ${{ steps.authorize.outputs.mode }}
        run: |
          root="$RUNNER_TEMP/novaos99"
          case "$RELEASE_MODE" in
            rehearsal) python3 scripts/novaos_build99_rehearsal.py recheck ;;
            production) python3 scripts/novaos_build99_production.py recheck ;;
            *) exit 1 ;;
          esac
          test "$(git -C "$root/source" rev-parse HEAD)" = "$FROZEN_SOURCE"
          source_status=$(git -C "$root/source" status --porcelain=v1 --untracked-files=all --ignored=matching)
          test -z "$source_status"
          sha256sum -c "$root/instrumentation.sha256"
      - name: Verify original production identity and sign the frozen Build 99 source
        env:
          FROZEN_SOURCE: ${{ steps.authorize.outputs.source }}
          KEYSTORE_BASE64: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRIVATE_GALLERY_SIGNING_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Original signer missing}" "${STORE_PASSWORD:?Missing signer password}" "${KEY_ALIAS:?Missing signer alias}" "${KEY_PASSWORD:?Missing key password}"
          root="$RUNNER_TEMP/novaos99"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test "$(git -C "$root/source" rev-parse HEAD)" = "$FROZEN_SOURCE"
          source_status=$(git -C "$root/source" status --porcelain=v1 --untracked-files=all --ignored=matching)
          test -z "$source_status"
          sha256sum -c "$root/instrumentation.sha256"
          umask 077
          signer=$(mktemp -d "$root/key.XXXXXXXX")
          trap 'rm -rf -- "$signer"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signer/original.jks"
          unset KEYSTORE_BASE64
          keytool -exportcert -keystore "$signer/original.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" -file "$signer/cert.der" >/dev/null
          test "$(sha256sum "$signer/cert.der" | cut -d ' ' -f 1)" = 94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17
          (
            cd "$root/source"
            export ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_FILE="$signer/original.jks"
            export ORG_GRADLE_PROJECT_PRIVATE_GALLERY_STORE_PASSWORD="$STORE_PASSWORD"
            export ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_ALIAS="$KEY_ALIAS"
            export ORG_GRADLE_PROJECT_PRIVATE_GALLERY_KEY_PASSWORD="$KEY_PASSWORD"
            ./gradlew lintRelease assembleRelease --stacktrace --no-daemon --console=plain
          )
          install -m 0400 "$root/source/app/build/outputs/apk/release/app-release.apk" "$root/candidate.apk"
          # Match the Build 97 v2/v3 signing range for the disposable fixture only.
          "$tools/apksigner" sign --ks "$signer/original.jks" --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD --min-sdk-version 24 --out "$root/instrumentation.apk" "$root/compiled-instrumentation.apk"
      - name: Verify the signed Build 99 APK and protected packaging
        run: |
          root="$RUNNER_TEMP/novaos99"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          python3 scripts/novaos_build99_rehearsal.py candidate "$root/candidate.apk" "$tools" > "$root/receipts/candidate-sha256.txt"
          python3 scripts/verify_signed_upgrade1711.py "$root/compiled-instrumentation.apk" "$root/instrumentation.apk"
          "$tools/apksigner" verify --min-sdk-version 24 --verbose --print-certs "$root/instrumentation.apk" > "$root/receipts/instrumentation-signature.txt"
          grep -Fx 'Number of signers: 1' "$root/receipts/instrumentation-signature.txt"
          grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$root/receipts/instrumentation-signature.txt"
          grep -Fx 'Signer #1 certificate SHA-256 digest: 94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17' "$root/receipts/instrumentation-signature.txt"
          "$tools/zipalign" -c -P 16 4 "$root/candidate.apk"
          python3 scripts/verify_backup_exclusions.py --project "$root/source" --apk "$root/candidate.apk" --aapt2 "$tools/aapt2"
          python3 scripts/verify_evidence179_distribution.py "$root/candidate.apk" arm64-v8a,x86_64 "$root/receipts/ocr-distribution.json"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Rehearse populated Build 97 to 99 upgrade and restart through the in-app updater
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FROZEN_SOURCE: ${{ steps.authorize.outputs.source }}
          PRODUCTION_UPGRADE: '1'
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          avd-name: novaos99-original-key-upgrade
          force-avd-creation: true
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: bash scripts/run_build99_upgrade.sh
      - name: Retain only non-sensitive Build 99 verification receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novaos-build99-${{ steps.authorize.outputs.mode }}-receipts
          path: ${{ runner.temp }}/novaos99/receipts
          if-no-files-found: error
          retention-days: 30
      - name: Stage verified Build 99 stable assets
        if: steps.authorize.outputs.mode == 'production'
        run: |
          root="$RUNNER_TEMP/novaos99"
          mkdir -m 0700 "$root/assets"
          install -m 0600 "$root/candidate.apk" "$root/assets/private-gallery-release.apk"
          python3 - "$root" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root = Path(sys.argv[1])
          dest = root / "assets"
          with (dest / "private-gallery-release.apk").open("rb") as apk:
              digest = hashlib.file_digest(apk, "sha256").hexdigest()
          assert digest == (root / "receipts/candidate-sha256.txt").read_text().strip()
          (dest / "private-gallery-release.apk.sha256").write_text(digest + "  private-gallery-release.apk\n")
          (dest / "private-gallery-release.metadata.json").write_text(json.dumps({
              "package": "uk.co.traynor.privategallery", "versionName": "2.0.0", "versionCode": 99,
              "apkSha256": digest,
              "certificateSha256": "94f2bfc6567f26d067d29077111cfd0ce86d38263c642ad115e43365f05b0d17",
          }, indent=2) + "\n")
          (dest / "notes.md").write_text(
              "NovaOS 2.0.0 (Build 99), Android 17.\n\n"
              "Themes Studio brings three original launcher styles to cover and inner layouts. Control Centre 2.0 adds swipe-down access to quick controls.\n"
          )
          PY
      - name: Retain verified Build 99 production publication inputs
        if: steps.authorize.outputs.mode == 'production'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novaos-build99-verified-stable-assets
          path: ${{ runner.temp }}/novaos99/assets
          if-no-files-found: error
          retention-days: 7
      - name: Remove all Build 99 key and APK material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/novaos99"
