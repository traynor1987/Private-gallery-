name: Private Gallery fast development
'on':
  push:
    branches:
    - main
    - release/**
    paths:
    - app/**
    - scripts/**
    - gradle/**
    - '*.gradle.kts'
    - gradle.properties
    - .github/workflows/fast-development.yml
  pull_request:
    paths:
    - app/**
    - scripts/**
    - gradle/**
    - '*.gradle.kts'
    - gradle.properties
    - .github/workflows/fast-development.yml
permissions:
  contents: read
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Restore Gradle dependencies and build cache
      id: gradle-cache
      uses: actions/cache/restore@v4
      with:
        path: '~/.gradle/caches

          ~/.gradle/wrapper

          '
        key: privacy1751-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: privacy1751-${{ runner.os }}-
    - name: Install Android SDK packages
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"
    - name: Verify installed Android 17 SDK metadata
      run: python3 scripts/verify_android17_sdk.py "$ANDROID_HOME" app/build/acceptance-diagnostics/android17-sdk.json
    - name: Viewer gesture and seeking arithmetic
      run: 'mkdir -p /tmp/viewer175

        java com.sun.tools.javac.Main -d /tmp/viewer175 app/src/main/java/uk/co/traynor/privategallery/core/ui/ViewerExperience.java scripts/tests/ViewerExperienceChecks.java

        java -cp /tmp/viewer175 ViewerExperienceChecks

        '
    - name: Verify release gates
      run: 'PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_ci_emulator_storage.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_release1751_configuration.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_release1752_configuration.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_release176_configuration.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_complete_regression175.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_professional_ui_method_evidence.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_release1751_platform_evidence.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_release1752_platform_evidence.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_release1761_configuration.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_release1761_platform_evidence.py

        java com.sun.tools.javac.Main -d /tmp/presentation1761 app/src/main/java/uk/co/traynor/privategallery/core/ui/InAppVersionPresentation.java scripts/tests/Presentation1761Checks.java

        java -cp /tmp/presentation1761 Presentation1761Checks

        java com.sun.tools.javac.Main -d /tmp/media1761 app/src/main/java/uk/co/traynor/privategallery/core/ui/MediaSelection.java app/src/main/java/uk/co/traynor/privategallery/core/hidden/HiddenRecordStore.java
        app/src/main/java/uk/co/traynor/privategallery/core/hidden/TransferJournal.java app/src/main/java/uk/co/traynor/privategallery/core/media/ExternalEditLease.java scripts/tests/MediaSelectionChecks.java
        scripts/tests/TransferJournalChecks.java scripts/tests/ExternalEditLeaseChecks.java

        java -cp /tmp/media1761 MediaSelectionChecks

        java -cp /tmp/media1761 TransferJournalChecks

        java -cp /tmp/media1761 ExternalEditLeaseChecks

        python3 scripts/test_professional_ui_release.py

        java com.sun.tools.javac.Main -d /tmp/combine-checks app/src/main/java/uk/co/traynor/privategallery/core/editor/CombinePrompt.java scripts/tests/CombinePromptChecks.java

        java -cp /tmp/combine-checks CombinePromptChecks

        java com.sun.tools.javac.Main -d /tmp/privacy-checks app/src/main/java/uk/co/traynor/privategallery/core/media/JpegPrivacy.java app/src/main/java/uk/co/traynor/privategallery/core/media/PngPrivacy.java
        scripts/tests/PngPrivacyChecks.java scripts/tests/JpegPrivacyChecks.java app/src/main/java/uk/co/traynor/privategallery/core/media/DisplayDateTime.java scripts/tests/DisplayDateChecks.java
        app/src/main/java/uk/co/traynor/privategallery/core/ui/MediaOrder.java scripts/tests/MediaSizeChecks.java

        java -cp /tmp/privacy-checks JpegPrivacyChecks

        java -cp /tmp/privacy-checks PngPrivacyChecks

        java -cp /tmp/privacy-checks DisplayDateChecks

        java -cp /tmp/privacy-checks MediaSizeChecks

        python3 scripts/tests/test_ci_onion_probe.py

        python3 scripts/tests/test_emulator_script_lines.py

        bash scripts/verify_controlled_onion_readiness.sh

        bash scripts/verify_socks_stage_diagnostics.sh

        bash scripts/verify_tor_control_events.sh

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_regression1761_focused.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_android17_media_environment.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_android17_sdk.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_runtime_diagnostic_reports.py


        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_risk_release_policy.py

        PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_patch1761_evidence.py

        '
    - name: Verify retired model weights are absent
      run: python3 scripts/verify_local_ai_distribution.py
    - name: Verify encrypted camera journal
      run: bash scripts/check_camera.sh
    - name: Verify bounded Hidden storage
      run: bash scripts/check_hidden_foundation.sh
    - name: Verify Hidden browser and diagnostics policy
      run: bash scripts/check_hidden_browser.sh
    - name: Test browser video helper
      run: node --test scripts/tests/*.test.cjs
    - name: Verify complete MP4 container boundaries
      run: bash scripts/check_video_container.sh
    - name: Enforce public-source no-secret boundary
      run: ./scripts/no_secret_scan.sh
    - name: Verify supported transport dependency path and notices
      run: bash ./scripts/verify_production_vpn_path.sh
    - run: ./gradlew compileDebugUnitTestKotlin compileDebugAndroidTestKotlin
    - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
    - name: Verify retired native runtime is absent from APK
      run: python3 scripts/verify_local_ai_distribution.py app/build/outputs/apk/debug/app-debug.apk
    - name: Inventory Hidden Tor native distribution
      run: python3 scripts/verify_hidden_tor_distribution.py app/build/outputs/apk/debug/app-debug.apk app/build/acceptance-diagnostics/tor-distribution.json
    - name: Verify TEST ONLY identity and APK signature
      if: github.ref == 'refs/heads/release/1.7.6.1-editing-settings-polish'
      run: 'mkdir -p app/build/acceptance-diagnostics

        APK=app/build/outputs/apk/debug/app-debug.apk

        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > app/build/acceptance-diagnostics/apk-signature.txt

        "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > app/build/acceptance-diagnostics/apk-badging.txt

        grep -q "package: name=''uk.co.traynor.privategallery.hiddenprototype''" app/build/acceptance-diagnostics/apk-badging.txt

        grep -Fxq "sdkVersion:''37''" app/build/acceptance-diagnostics/apk-badging.txt

        grep -q ''TEST-ONLY'' app/build/acceptance-diagnostics/apk-badging.txt

        sha256sum "$APK" > app/build/acceptance-diagnostics/apk-sha256.txt

        '
    - name: Save successful compilation cache before runtime gates
      if: steps.gradle-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: '~/.gradle/caches

          ~/.gradle/wrapper

          '
        key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
    - name: Record exact fast source
      run: 'mkdir -p app/build/fast-evidence

        git rev-parse HEAD > app/build/fast-evidence/source-sha.txt

        python3 scripts/release_policy.py classify --baseline HEAD~1 --output app/build/fast-evidence/impact.json'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: private-gallery-fast-evidence
        path: 'app/build/fast-evidence

          app/build/test-results

          app/build/reports/lint-results-debug.html'
        if-no-files-found: warn
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork == true) && !(github.event_name == 'push' && github.ref == 'refs/heads/release/1.7.6.2-ui-browser-polish' && contains(github.event.head_commit.message, '[focused1762]'))
