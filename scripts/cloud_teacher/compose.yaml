name: nova-cloud-teacher
services:
  teacher:
    image: nova-cloud-teacher:${NOVA_IMAGE_TAG:?Set a reviewed commit tag}
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - ${NOVA_CONFIG_DIR:-/etc/nova-cloud-teacher}/settings.env
    environment:
      NOVA_CLOUD_BIND: 0.0.0.0
      NOVA_CLOUD_BUDGET_DB: /state/budget.db
      NOVA_CLOUD_TEACHER_TOKEN_FILE: /run/secrets/owner-token
      OPENAI_API_KEY_FILE: /run/secrets/openai-key
    ports:
      - "127.0.0.1:${NOVA_HOST_PORT:-8787}:8787"
    volumes:
      - state:/state
      - type: bind
        source: ${NOVA_CONFIG_DIR:-/etc/nova-cloud-teacher}/secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 80
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8787/health', timeout=3).status == 200"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "none"
volumes:
  state:
