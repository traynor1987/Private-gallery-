# Include within nginx's http context after certificate provisioning.
limit_req_zone $binary_remote_addr zone=nova_teacher_per_ip:1m rate=12r/m;

server {
    listen 80;
    server_name brain.jamestraynor.co.uk;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nova-cloud-acme; }
    location / { return 308 https://brain.jamestraynor.co.uk$request_uri; }
}

server {
    listen 443 ssl;
    server_name brain.jamestraynor.co.uk;
    ssl_certificate /etc/letsencrypt/live/brain.jamestraynor.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain.jamestraynor.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    client_body_timeout 8s;
    limit_req_status 429;

    location ~ ^/(health|guardian/(status|analyze))$ {
        limit_req zone=nova_teacher_per_ip burst=6 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host brain.jamestraynor.co.uk;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
    }
    location / { return 404; }
}
